<style>
/* ============================================================
   CENTRO — Personal Control Center
   Design tokens
   ============================================================ */
:root {
  /* Color */
  --bg: #0A0C0F;
  --bg-elev-1: #12151A;
  --bg-elev-2: #1A1E25;
  --bg-elev-3: #232833;
  --hairline: #262B34;
  --text: #F1EFE9;
  --text-dim: #9AA0AC;
  --text-faint: #5D636E;
  --accent: #E3A857;      /* amber — primary signature accent */
  --accent-dim: #8A6A3B;
  --accent-glow: rgba(227, 168, 87, 0.18);
  --cyan: #57C7C2;        /* water / positive secondary */
  --green: #6FCF97;       /* gains / completed */
  --red: #E2685C;         /* losses / warnings */
  --blue: #2F6FED;        /* strong blue — cash income */

  /* Type */
  --font-display: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
  --font-body: 'Inter', ui-sans-serif, system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;

  /* Radii / spacing */
  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
  --nav-h: 64px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
html {
  overflow: hidden;
  height: 100%;
}
body {
  height: calc(100dvh / var(--ui-scale, 1));
  width: calc((100vw - (2 * var(--side-margin, 0px))) / var(--ui-scale, 1));
  transform: translate(var(--side-margin, 0px), 0px) scale(var(--ui-scale, 1));
  transform-origin: top left;
  overflow: hidden;
}
#root {
  height: 100%;
  display: flex;
  flex-direction: column;
}
button {
  font-family: inherit;
  border: none;
  background: none;
  color: inherit;
  cursor: pointer;
}
input, textarea, select {
  font-family: inherit;
  color: var(--text);
  background: var(--bg-elev-2);
  border: 1px solid var(--hairline);
  border-radius: var(--r-sm);
  padding: 10px 12px;
  font-size: 15px;
  outline: none;
}
input:focus, textarea:focus, select:focus,
button:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
a { color: var(--accent); text-decoration: none; }

::-webkit-scrollbar { width: 0; height: 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
  }
}

/* ---------- Layout shell ---------- */
.app-header {
  padding: calc(14px + var(--safe-top)) 20px 14px;
  flex-shrink: 0;
}
.app-header .eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--accent);
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 6px;
}
.app-header .eyebrow .brand-logo {
  width: 18px;
  height: 18px;
  object-fit: contain;
  border-radius: 5px;
  flex-shrink: 0;
}
.logo-option-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 4px;
}
.logo-option {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 10px 6px;
  border-radius: var(--r-md);
  background: var(--bg-elev-2);
  border: 1.5px solid var(--hairline);
  font-size: 12px;
  color: var(--text-dim);
  text-align: center;
}
.logo-option.active {
  border-color: var(--accent);
  color: var(--text);
  box-shadow: 0 0 0 1px var(--accent) inset;
}
.logo-option-thumb {
  width: 52px;
  height: 52px;
  border-radius: 12px;
  background: var(--bg-elev-3);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.logo-option-thumb img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.logo-option-thumb.logo-option-empty {
  font-size: 10px;
  font-family: var(--font-mono);
  letter-spacing: 0.06em;
  color: var(--text-faint);
  padding: 4px;
}
.logo-option-upload .logo-option-thumb {
  font-size: 20px;
}
.app-header h1 {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 600;
  margin: 2px 0 0;
  letter-spacing: -0.01em;
}
.screen {
  flex: 1;
  overflow-y: auto;
  padding: 0 16px calc(var(--nav-h) + 24px + var(--safe-bottom));
}
.screen-title {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 600;
  margin: 10px 4px 14px;
}

/* ---------- Bottom nav ---------- */
.bottom-nav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: calc(var(--nav-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: rgba(18, 21, 26, 0.92);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--hairline);
  display: flex;
  z-index: 50;
  overflow-x: auto;
  overflow-y: hidden;
  justify-content: flex-start;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.nav-item {
  flex: 0 0 78px;
  min-width: 78px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: var(--text-faint);
  font-size: 10.5px;
  font-family: var(--font-mono);
  letter-spacing: 0.02em;
  transition: color 0.2s ease;
}
.nav-item .icon { font-size: 19px; line-height: 1; filter: grayscale(1); opacity: 0.6; transition: all 0.2s ease; }
.nav-item.active { color: var(--accent); }
.nav-item.active .icon { filter: none; opacity: 1; transform: translateY(-1px); }

/* ---------- Card ---------- */
.card {
  background: var(--bg-elev-1);
  border: 1px solid var(--hairline);
  border-radius: var(--r-lg);
  padding: 18px;
  margin-bottom: 12px;
}
.card-title {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin: 0 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* ---------- Progress bar ---------- */
.bar-track {
  height: 8px;
  background: var(--bg-elev-3);
  border-radius: 99px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--accent-dim), var(--accent));
  transition: width 0.5s cubic-bezier(.2,.8,.2,1);
}

/* ---------- Checklist item (habit/task) ---------- */
.check-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 4px;
  border-bottom: 1px solid var(--hairline);
  transition: opacity 0.45s ease, transform 0.45s ease, max-height 0.45s ease, padding 0.45s ease, margin 0.45s ease;
  max-height: 60px;
  overflow: hidden;
}
.check-row:last-child { border-bottom: none; }
.check-row.completing {
  opacity: 0;
  transform: translateX(24px) scale(0.97);
  max-height: 0;
  padding-top: 0; padding-bottom: 0;
  margin: 0;
  border-bottom-color: transparent;
}
.check-circle {
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 2px solid var(--text-faint);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.25s ease;
}
.check-circle.checked {
  border-color: var(--green);
  background: var(--green);
}
.check-circle.checked::after {
  content: '✓';
  color: #08130D;
  font-size: 13px;
  font-weight: 700;
}
.check-label { flex: 1; font-size: 15px; }
.check-meta { font-size: 12px; color: var(--text-faint); font-family: var(--font-mono); }

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-faint);
}
.empty-state .glyph { font-size: 28px; margin-bottom: 8px; display:block; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 18px;
  border-radius: var(--r-sm);
  font-size: 14px;
  font-weight: 600;
  font-family: var(--font-body);
}
.btn-primary { background: var(--accent); color: #201404; }
.btn-ghost { background: var(--bg-elev-2); color: var(--text); border: 1px solid var(--hairline); }
.btn-danger { background: rgba(226,104,92,0.14); color: var(--red); border: 1px solid rgba(226,104,92,0.3); }
.btn-block { width: 100%; }
.btn-sm { padding: 8px 12px; font-size: 13px; }
.fab {
  position: fixed;
  right: 20px;
  bottom: calc(var(--nav-h) + 20px + var(--safe-bottom));
  width: 52px; height: 52px;
  border-radius: 50%;
  background: var(--accent);
  color: #201404;
  font-size: 24px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 24px var(--accent-glow);
  z-index: 40;
}

/* ---------- Modal / sheet ---------- */
.sheet-backdrop {
  position: fixed; inset: 0;
  background: rgba(6,7,9,0.65);
  backdrop-filter: blur(2px);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  animation: fadeIn 0.2s ease;
}
.sheet {
  background: var(--bg-elev-1);
  border: 1px solid var(--hairline);
  border-bottom: none;
  border-radius: 24px 24px 0 0;
  width: 100%;
  max-height: 88dvh;
  overflow-y: auto;
  padding: 10px 20px calc(24px + var(--safe-bottom));
  animation: slideUp 0.28s cubic-bezier(.2,.8,.2,1);
}
.sheet-handle {
  width: 36px; height: 4px;
  background: var(--hairline);
  border-radius: 99px;
  margin: 6px auto 16px;
}
.sheet h2 { font-family: var(--font-display); font-size: 19px; margin: 0 0 16px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; font-family: var(--font-mono); letter-spacing: 0.03em; }
.field input, .field textarea, .field select { width: 100%; }
.segmented {
  display: flex;
  background: var(--bg-elev-2);
  border-radius: var(--r-sm);
  padding: 3px;
  border: 1px solid var(--hairline);
}
.segmented button {
  flex: 1;
  padding: 9px 6px;
  font-size: 13px;
  border-radius: 7px;
  color: var(--text-dim);
  text-align: center;
}
.segmented button.active { background: var(--bg-elev-3); color: var(--text); }
.sheet-actions { display: flex; gap: 10px; margin-top: 18px; }
.sheet-actions .btn { flex: 1; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

/* ---------- Ring gauge (signature element) ---------- */
.ring-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; }
.ring-wrap svg { transform: rotate(-90deg); }
.ring-track { fill: none; stroke: var(--bg-elev-3); }
.ring-fill { fill: none; stroke-linecap: round; transition: stroke-dashoffset 0.6s cubic-bezier(.2,.8,.2,1); }
.ring-center { position: absolute; text-align: center; }
.ring-center .num { font-family: var(--font-display); font-weight: 700; line-height: 1; }
.ring-center .label { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); letter-spacing: 0.06em; margin-top: 4px; }

/* ---------- Grid ---------- */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat-tile { background: var(--bg-elev-2); border-radius: var(--r-md); padding: 14px; }
.stat-tile .v { font-family: var(--font-mono); font-size: 19px; font-weight: 600; }
.stat-tile .k { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

.pill {
  display: inline-block;
  padding: 3px 9px;
  border-radius: 99px;
  font-size: 11px;
  font-family: var(--font-mono);
  background: var(--bg-elev-3);
  color: var(--text-dim);
}
.pill.warn { background: rgba(226,104,92,0.15); color: var(--red); }
.pill.good { background: rgba(111,207,151,0.15); color: var(--green); }

.activity-toggle button.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.activity-block:last-child .activity-toggle button{font-size:11px}
.cal-mode-toggle{width:100%}
.cal-mode-toggle button{font-size:11.5px;line-height:1.3;padding:9px 8px}
@media (max-width:520px){.activity-input-grid{grid-template-columns:1fr}.activity-block{padding:14px}.modal{padding-left:14px;padding-right:14px}}
@media (min-width:701px){.modal-backdrop{align-items:center;justify-content:center;padding:24px}.modal{width:min(560px,100%);border-radius:24px;box-shadow:0 24px 80px rgba(0,0,0,.28);padding:12px 20px 20px}.modal-handle{display:none}}

.bottom-nav::-webkit-scrollbar{display:none}
.activity-home-card{cursor:pointer}
.activity-mini{display:flex;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--hairline);font-size:11px;color:var(--text-faint);font-family:var(--font-mono)}
@media (min-width:701px){.nav-item{flex:1;min-width:0}.bottom-nav{overflow-x:hidden;justify-content:stretch}}

/* Trading — multi-account additions (scoped to Trading section only) */
.account-mini{padding:0;overflow:hidden}
.account-mini-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px;text-align:left}
.account-mini-info strong{display:block;font-size:15px}
.account-mini-info small{display:block;margin-top:3px;color:var(--text-dim);font-size:11px}
.account-mini-numbers{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.account-mini-numbers span{font-family:var(--font-mono);font-size:12px;color:var(--text-dim)}
.account-mini-numbers strong{font-family:var(--font-mono);font-size:14px}
.chevron{color:var(--text-faint);font-size:13px}
.day-bars-wrap{margin-top:10px;overflow-x:auto}
.day-bars{display:flex;align-items:flex-end;gap:3px;min-height:60px;padding-bottom:2px}
.day-bar-col{flex:0 0 auto;width:7px;display:flex;align-items:flex-end}
.day-bar{width:7px;border-radius:3px;background:var(--bg-elev-3)}
.day-bar.up{background:var(--green)}
.day-bar.down{background:var(--red)}
.goal-block{display:flex;flex-direction:column;gap:10px}

/* Trading — v4 additions: BUY/SELL buttons, chart markers, donut, day-of-week bars, status banners */
.trade-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn-buy{background:var(--green);color:#08170e;font-weight:700;letter-spacing:.03em}
.btn-sell{background:var(--red);color:#1d0906;font-weight:700;letter-spacing:.03em}
.chart-marker{font-family:var(--font-mono);font-size:9px;font-weight:600;pointer-events:none}
.chart-marker.up{fill:var(--green)}
.chart-marker.down{fill:var(--red)}
.donut-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 0}
.trading-donut{width:170px;height:170px}
.donut-center-big{font-family:var(--font-display);font-size:24px;font-weight:700;fill:var(--text)}
.donut-center-small{font-size:10px;fill:var(--text-dim);letter-spacing:.06em}
.donut-legend{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--text-dim);flex-wrap:wrap;justify-content:center}

.legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto}
.dow-bars-wrap{margin-top:10px}

.dow-bar{width:100%;max-width:24px;border-radius:5px 5px 2px 2px;background:var(--bg-elev-3)}
.dow-bar.up{background:var(--green)}
.dow-bar.down{background:var(--red)}
.dow-bar-col small{color:var(--text-faint);font-size:9px;white-space:nowrap}
.status-banner{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.status-banner strong{font-family:var(--font-display);font-size:16px}
.status-banner span{font-size:13px;color:var(--text-dim)}
.status-lost{border-color:rgba(226,104,92,.4);background:rgba(226,104,92,.08)}
.status-lost strong{color:var(--red)}
.status-won{border-color:rgba(111,207,151,.4);background:rgba(111,207,151,.08)}
.status-won strong{color:var(--green)}

/* Trading — monthly performance calendar */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-nav strong{font-family:var(--font-display);font-size:14px;text-transform:capitalize}
.cal-nav .icon-btn:disabled{opacity:.3;cursor:default}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-grid.cal-head{margin-bottom:4px}
.cal-headcell{text-align:center;color:var(--text-faint);font-size:10px;font-family:var(--font-mono);padding:2px 0}
.cal-cell{min-height:52px}
.cal-empty{visibility:hidden}
.cal-day{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:1px;padding:5px 4px;border-radius:8px;background:var(--bg-elev-2);border:1px solid transparent;font-family:inherit;text-align:left;width:100%;overflow:hidden}
.cal-day.is-today{border-color:var(--accent)}

.cal-daynum{font-size:11px;color:var(--text-dim);font-family:var(--font-mono)}
.cal-ops{font-size:8px;color:var(--text-faint);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cal-amount{font-size:10px;font-weight:600;font-family:var(--font-mono);color:var(--text-dim)}

.cal-day.loss .cal-amount{color:var(--red)}

/* Escalado visual de la web */
.scale-row{padding:13px 0;border-bottom:1px solid var(--hairline);}
.scale-row:last-child{border-bottom:none;}
.scale-row-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;}

.scale-slider{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:var(--bg-elev-3);outline:none;margin:6px 0;}
.scale-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg);}
.scale-slider::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg);}
.scale-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--text-faint);font-family:var(--font-mono);margin-top:2px;}



/* ---------- Montevideo weather widget (feature-scoped) ---------- */
.weather-card{min-width:0;overflow:hidden;cursor:pointer;padding:0!important;min-height:0;transition:box-shadow .22s ease,background .22s ease,transform .18s ease,border-color .22s ease;}
.weather-card-inner{
  min-width:0;width:100%;height:100%;min-height:86px;box-sizing:border-box;
  position:relative;display:block;padding:9px 7px;overflow:hidden;isolation:isolate;
}
/* Nueva estructura interna, reconstruida desde cero. El exterior del widget permanece intacto. */
.weather-final-header{
  position:absolute;left:7px;right:7px;top:13%;
  width:auto;height:18px;display:flex;align-items:center;justify-content:space-between;
  gap:8px;pointer-events:none;box-sizing:border-box;min-width:0;
}
.weather-final-place{min-width:0;flex:1;text-align:center;padding-left:18px;}
.weather-final-place strong{
  display:block;font-family:var(--font-display);font-size:9px;line-height:1;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
}
.weather-final-icons{
  min-width:0;max-width:44%;height:100%;display:flex;align-items:center;justify-content:flex-end;
  gap:3px;flex:0 0 auto;overflow:hidden;
}
.weather-final-icon{
  position:static;transform:none;display:block;flex:0 1 auto;min-width:0;max-width:100%;
  font-size:16px;line-height:1;filter:saturate(.95);white-space:nowrap;
}
.weather-final-moon{
  display:block;flex:0 0 auto;font-size:14px;line-height:1;
}
.weather-final-temp{
  position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);
  margin:0;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:ui-rounded,var(--font-display),system-ui,sans-serif;
  font-size:27px;font-weight:780;line-height:.95;letter-spacing:-.045em;text-align:center;
}
.weather-final-footer{
  position:absolute;left:12%;right:12%;bottom:14%;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  box-sizing:border-box;min-width:0;
}
.weather-final-feel,.weather-final-rain{
  min-width:0;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-weight:650;line-height:1.08;
}
.weather-final-feel{font-size:10px;text-align:left;}
.weather-final-rain{font-size:8px;text-align:right;}
.weather-alert,.weather-meta{display:none;}
.weather-card.weather-yellow{border-color:rgba(244,196,48,.48);background:rgba(244,196,48,.09);box-shadow:0 0 10px rgba(244,196,48,.32),0 0 22px rgba(244,196,48,.12);}
.weather-card.weather-orange{border-color:rgba(246,144,46,.52);background:rgba(246,144,46,.10);box-shadow:0 0 10px rgba(246,144,46,.34),0 0 24px rgba(246,144,46,.14);}
.weather-card.weather-red{border-color:rgba(226,104,92,.58);background:rgba(226,104,92,.11);box-shadow:0 0 11px rgba(226,104,92,.38),0 0 26px rgba(226,104,92,.15);}
.weather-card.weather-none{box-shadow:none;}
.weather-rain-label{display:none;}
@media (max-width:700px){
  .weather-card-inner{min-height:82px;padding:8px 6px;}
  .weather-final-header{top:13%;}
  .weather-final-icon{font-size:16px;}
  .weather-final-moon{font-size:13px;}
  .weather-final-temp{font-size:25px;}
  .weather-final-footer{left:12%;right:12%;bottom:14%;}
}
@media (min-width:1000px){
  .weather-card-inner{min-height:90px;padding:10px 8px;}
  .weather-final-temp{font-size:28px;}
  .weather-final-icon{font-size:16px;}
  .weather-final-moon{font-size:14px;}
}

/* ---------- Smartwatch reminder (feature-scoped) ---------- */
.fitness-reminder{
  position:relative;
  display:grid;
  grid-template-columns:104px 1fr;
  gap:14px;
  align-items:center;
  margin-bottom:12px;
  padding:14px;
  overflow:hidden;
  border:1px solid var(--hairline);
  border-radius:22px;
  background:
    radial-gradient(circle at 12% 12%, rgba(227,168,87,.10), transparent 36%),
    var(--bg-elev-1);
  box-shadow:0 12px 34px rgba(0,0,0,.12);
  transition:border-color .25s ease, box-shadow .25s ease, transform .25s ease, background .25s ease;
}
.fitness-reminder:hover{transform:translateY(-1px)}
.fitness-reminder.is-orange{
  border-color:rgba(246,144,46,.58);
  background:
    radial-gradient(circle at 12% 12%, rgba(246,144,46,.16), transparent 42%),
    var(--bg-elev-1);
  box-shadow:0 12px 34px rgba(246,144,46,.11);
}
.fitness-reminder.is-red{
  border-color:rgba(226,104,92,.62);
  background:
    radial-gradient(circle at 12% 12%, rgba(226,104,92,.18), transparent 44%),
    var(--bg-elev-1);
  box-shadow:0 12px 36px rgba(226,104,92,.14);
}
.fitness-reminder.is-night{
  border-color:rgba(227,168,87,.72);
  background:
    radial-gradient(circle at 14% 18%, rgba(227,168,87,.18), transparent 46%),
    var(--bg-elev-1);
  box-shadow:0 14px 42px rgba(227,168,87,.15);
}
.fitness-reminder-image-zone{
  width:100%;
  aspect-ratio:1 / 1.18;
  border-radius:18px;
  background:var(--bg-elev-2);
  border:1px solid var(--hairline);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
  cursor:pointer;
}
.fitness-reminder-image-zone img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  pointer-events:none;
  filter:drop-shadow(0 8px 18px rgba(0,0,0,.20));
}
.fitness-reminder-copy{min-width:0}
.fitness-reminder-kicker{
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:6px;
  color:var(--text-faint);
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.fitness-reminder-status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 4px rgba(227,168,87,.12);
  flex:0 0 auto;
}
.fitness-reminder.is-orange .fitness-reminder-status-dot{background:#f6902e;box-shadow:0 0 0 4px rgba(246,144,46,.12)}
.fitness-reminder.is-red .fitness-reminder-status-dot{background:var(--red);box-shadow:0 0 0 4px rgba(226,104,92,.13)}
.fitness-reminder.is-night .fitness-reminder-status-dot{background:var(--accent);box-shadow:0 0 0 4px rgba(227,168,87,.16)}
.fitness-reminder-title{
  margin:0;
  font-family:var(--font-display);
  font-size:17px;
  line-height:1.18;
  font-weight:650;
}
.fitness-reminder-message{
  margin:7px 0 12px;
  color:var(--text-dim);
  font-size:13px;
  line-height:1.45;
}
.fitness-reminder-device{
  display:inline-flex;
  align-items:center;
  gap:6px;
  max-width:100%;
  margin-bottom:10px;
  padding:4px 8px;
  border-radius:999px;
  background:var(--bg-elev-2);
  color:var(--text-dim);
  font-family:var(--font-mono);
  font-size:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.fitness-reminder .fitness-confirm{
  width:100%;
  min-height:44px;
  transition:filter .2s ease, transform .2s ease;
}
.fitness-reminder .fitness-confirm:hover{filter:brightness(1.06)}
.fitness-reminder .fitness-confirm:active{transform:translateY(1px)}
.fitness-reminder-hint{
  margin-top:7px;
  color:var(--text-faint);
  font-size:10px;
  line-height:1.35;
}
.fitness-settings-note{
  margin:0 0 12px;
  color:var(--text-dim);
  font-size:12px;
  line-height:1.5;
}
.fitness-setting-badge{
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--text-dim);
}
.fitness-config-preview{
  width:100%;
  height:150px;
  border-radius:16px;
  background:var(--bg-elev-2);
  border:1px solid var(--hairline);
  object-fit:contain;
  display:block;
  margin:0 0 12px;
}
.fitness-config-help{
  margin:0 0 12px;
  padding:10px 12px;
  border-radius:12px;
  background:var(--bg-elev-2);
  color:var(--text-dim);
  font-size:11px;
  line-height:1.45;
}
.fitness-config-actions{
  display:flex;
  gap:8px;
  margin-top:8px;
}
.fitness-config-actions .btn{flex:1}
@media (max-width:520px){
  .fitness-reminder{
    grid-template-columns:88px 1fr;
    gap:12px;
    padding:12px;
    border-radius:20px;
  }
  .fitness-reminder-image-zone{border-radius:16px}
  .fitness-reminder-title{font-size:16px}
  .fitness-reminder-message{font-size:12.5px;margin-bottom:10px}
}
@media (min-width:701px){
  .fitness-reminder{grid-column:1/-1}
}


/* ---------- Inicio — edición/reflow de burbujas ---------- */
.home-screen{position:relative;}
.home-bubble-board{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:12px;width:100%;min-width:0;align-items:stretch;grid-auto-flow:row dense;}
.home-summary-anchor{grid-column:1/-1;order:0;min-width:0;}
.home-widget{grid-column:span 24;min-width:0;width:100%;max-width:100%;position:relative;order:10;align-self:stretch;display:flex;}
.home-widget>.card,.home-widget>.fitness-reminder{width:100%;max-width:100%;margin:0;min-width:0;height:100%;}
.home-widget[style*="height:"]>.card,.home-widget[style*="height:"]>.fitness-reminder{height:100%;min-height:0;}
.home-widget[style*="height:"]>.card{overflow:auto;}
.home-bubble-board.is-editing .home-widget{cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;}
.home-bubble-board.is-editing .home-widget.is-dragging{opacity:.72;cursor:grabbing;z-index:70;transform:scale(.995);}
.home-bubble-board.is-editing .home-widget.is-selected{outline:2px solid var(--accent);outline-offset:3px;border-radius:24px;}
.home-bubble-board.is-editing .home-widget.is-drop-target::before{content:"";position:absolute;inset:-5px 0;border:2px dashed var(--accent);border-radius:24px;pointer-events:none;opacity:.75;}
.home-layout-editor{position:fixed;left:50%;bottom:calc(var(--nav-h) + 12px + var(--safe-bottom));transform:translateX(-50%);width:min(560px,calc(100% - 24px));z-index:90;background:var(--bg-elev-1);border:1px solid var(--hairline);border-radius:20px;box-shadow:0 20px 70px rgba(0,0,0,.32);padding:14px;animation:homeEditorIn .2s ease;}
.home-layout-editor .editor-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.home-layout-editor .editor-head strong{font-family:var(--font-display);font-size:16px}.home-layout-editor .editor-head small{display:block;margin-top:3px;color:var(--text-faint);font-size:11px}.home-layout-editor .editor-field{padding:10px 0;border-top:1px solid var(--hairline)}.home-layout-editor .editor-field:first-of-type{border-top:none}.home-layout-editor .editor-label{display:flex;justify-content:space-between;margin-bottom:7px;font-size:12px;color:var(--text-dim)}.home-layout-editor .editor-label strong{font-family:var(--font-mono);color:var(--accent)}.home-layout-editor input[type=range]{width:100%}.home-layout-editor .editor-help{margin:9px 0 0;color:var(--text-faint);font-size:10px;line-height:1.4}.home-layout-editor .editor-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.home-layout-editor .editor-actions .btn{flex:1;min-width:130px}.home-layout-editor .editor-actions .btn-danger{flex:0 0 auto}
@keyframes homeEditorIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@media (min-width:1000px){.screen.home-screen{padding-top:20px;position:relative;z-index:1}.app-header{position:relative;z-index:30}.home-bubble-board{grid-column:1/-1}.home-widget--smartwatch{grid-column:span 24}.home-widget--water{grid-column:span 24}.home-widget--calories{grid-column:span 17}.home-widget--weather{grid-column:span 7}.home-widget--activity{grid-column:span 24}.home-widget--trading,.home-widget--habits,.home-widget--tasks,.home-widget--market,.home-widget--finance{grid-column:span 12}}
@media (min-width:701px) and (max-width:999px){.home-widget--smartwatch{grid-column:span 24}.home-widget--water{grid-column:span 24}.home-widget--calories{grid-column:span 16}.home-widget--weather{grid-column:span 8}.home-widget--activity{grid-column:span 24}.home-widget--trading,.home-widget--habits,.home-widget--tasks,.home-widget--market,.home-widget--finance{grid-column:span 12}}
@media (min-width:1000px){.screen.movie-screen > .card{grid-column:1/-1;}.screen.movie-screen > .movie-content-card{grid-column:1/-1;}}
@media (max-width:700px){.home-widget--water{grid-column:span 24}.home-widget--calories{grid-column:span 16}.home-widget--weather{grid-column:span 8}.home-widget--smartwatch,.home-widget--activity,.home-widget--habits,.home-widget--tasks,.home-widget--market,.home-widget--finance{grid-column:span 24}.home-widget--trading{grid-column:span 12}.home-layout-editor{bottom:calc(var(--nav-h) + 8px + var(--safe-bottom));padding:12px;border-radius:18px}.home-layout-editor .editor-actions{display:grid;grid-template-columns:1fr 1fr}.home-layout-editor .editor-actions .btn{min-width:0}}

<div id="root"></div>
<script>
(function () {
  'use strict';
  const DB_NAME = 'centro-db';
  const DB_VERSION = 8;
  const STORES = {
    habitDefs: 'id', habitStatus: 'id', taskDefs: 'id', taskStatus: 'id',
    water: 'date', calories: 'date', running: 'date', trading: 'id',
    tradingConfig: 'id', tradingAccounts: 'id', tradingDayAdjustments: 'id', finance: 'id', links: 'id', notes: 'id', settings: 'id', nytStatus: 'date',
    gymRoutines: 'id', gymExercises: 'id', movies: 'id'
  };
  let dbPromise = null;
  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        const txu = e.target.transaction;
        // Trading changed in v3 from one record per day to one record per entry.
        // Preserve existing daily records by migrating them to unique entry IDs.
        if (e.oldVersion < 3 && db.objectStoreNames.contains('trading')) {
          const oldStore = txu.objectStore('trading');
          const oldReq = oldStore.getAll();
          oldReq.onsuccess = () => {
            const oldRows = oldReq.result || [];
            db.deleteObjectStore('trading');
            const newStore = db.createObjectStore('trading', { keyPath: 'id' });
            newStore.createIndex('by_date', 'date');
            for (const row of oldRows) {
              const migrated = { ...row, id: `legacy_${row.date}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,6)}`, time: '00:00' };
              newStore.put(migrated);
            }
          };
        }
        for (const [name, keyPath] of Object.entries(STORES)) {
          if (name === 'trading' && e.oldVersion < 3 && db.objectStoreNames.contains('trading')) continue;
          let store;
          if (!db.objectStoreNames.contains(name)) store = db.createObjectStore(name, { keyPath });
          else store = txu.objectStore(name);
          if (name === 'habitStatus' && !store.indexNames.contains('by_habit')) store.createIndex('by_habit', 'habitId');
          if (name === 'taskStatus' && !store.indexNames.contains('by_task')) store.createIndex('by_task', 'taskId');
          if (name === 'trading' && !store.indexNames.contains('by_date')) store.createIndex('by_date', 'date');
          if (name === 'trading' && !store.indexNames.contains('by_account')) store.createIndex('by_account', 'accountId');
          if (name === 'tradingDayAdjustments' && !store.indexNames.contains('by_account')) store.createIndex('by_account', 'accountId');
          if (name === 'gymExercises' && !store.indexNames.contains('by_routine')) store.createIndex('by_routine', 'routineId');
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }
  async function tx(store, mode='readonly') { const db = await openDB(); return db.transaction(store, mode).objectStore(store); }
  async function get(store, key) { const s = await tx(store); return new Promise((res, rej) => { const r=s.get(key); r.onsuccess=()=>res(r.result ?? null); r.onerror=()=>rej(r.error); }); }
  async function all(store) { const s=await tx(store); return new Promise((res,rej)=>{const r=s.getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);}); }
  async function put(store, val) { const s=await tx(store,'readwrite'); return new Promise((res,rej)=>{const r=s.put(val);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}); }
  async function del(store,key) { const s=await tx(store,'readwrite'); return new Promise((res,rej)=>{const r=s.delete(key);r.onsuccess=()=>res(true);r.onerror=()=>rej(r.error);}); }
  async function clear(store) { const s=await tx(store,'readwrite'); return new Promise((res,rej)=>{const r=s.clear();r.onsuccess=()=>res(true);r.onerror=()=>rej(r.error);}); }
  async function byIndex(store,index,value) { const s=await tx(store); if(!s.indexNames.contains(index)) return []; return new Promise((res,rej)=>{const r=s.index(index).getAll(value);r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);}); }
  function uid(){return `${Date.now().toString(36)}${Math.random().toString(36).slice(2,8)}`;}
  window.CentroDB = { openDB, get, all, put, del, clear, byIndex, uid, STORES };
})();

  async function tradingAccountStats(accountId){
    const acc=await getTradingAccount(accountId);
    const entries=await tradingEntriesForAccount(accountId);
    const buys=entries.filter(e=>e.direction==='buy');
    const sells=entries.filter(e=>e.direction==='sell');
    const buyWins=buys.filter(e=>e.result==='gain').length;
    const sellWins=sells.filter(e=>e.result==='gain').length;
    let gain=0,loss=0,wins=0,losses=0,breakeven=0,maxWin=0,maxLoss=0,consecLosses=0,maxConsecLosses=0;
    for(const e of entries){

      else if(e.amount<0){loss+=e.amount;losses++;if(e.amount<maxLoss)maxLoss=e.amount;consecLosses++;if(consecLosses>maxConsecLosses)maxConsecLosses=consecLosses;}

    }
    const net=gain+loss;

    const todayNet=dayMap[today()]||0;
    const drawdown=Math.max(0,-net);
    const dailyLossRemaining=acc?.dailyLossMax?Math.max(0,Number(acc.dailyLossMax)-Math.max(0,-todayNet)):null;
    const totalLossRemaining=acc?.totalLossMax?Math.max(0,Number(acc.totalLossMax)-drawdown):null;
    const profitRemaining=acc?.profitTarget?Math.max(0,Number(acc.profitTarget)-net):null;
    const profitProgress=acc?.profitTarget?Math.min(100,Math.max(0,net/Number(acc.profitTarget)*100)):null;
    const dailyLossHit=!!(acc?.dailyLossMax && Math.max(0,-todayNet)>=Number(acc.dailyLossMax));
    const totalLossHit=!!(acc?.totalLossMax && drawdown>=Number(acc.totalLossMax));
    const goalHit=!!(acc?.profitTarget && net>=Number(acc.profitTarget));

      dowMap[d]=(dowMap[d]||0)+(Number(e.amount)||0);
    }
    return {
      initialCapital,currentCapital,gain,loss,net,wins,losses,breakeven,
      buyWinRate:buys.length?Math.round(buyWins/buys.length*100):0,
      sellWinRate:sells.length?Math.round(sellWins/sells.length*100):0,
      buyCount:buys.length,sellCount:sells.length,
      entries:entries.length,dayMap,todayNet,drawdown,
      dailyLossRemaining,totalLossRemaining,profitRemaining,profitProgress,
      maxWin,maxLoss,maxConsecLosses,profitFactor,
      dailyLossHit,totalLossHit,goalHit,dowMap
    };
  }
  async function accountEquity(accountId){
    const acc=await getTradingAccount(accountId);
    const entries=await tradingEntriesForAccount(accountId);
    let cap=Number(acc?.initialCapital)||0;
    const pts=[{date:'Inicio',time:'',capital:cap,amount:0,direction:null}];
    for(const e of entries){cap+=Number(e.amount)||0;pts.push({id:e.id,date:e.date,time:e.time||'',capital:cap,amount:e.amount,direction:e.direction});}
    return pts;
  }

  // ---- Trading — monthly performance calendar (manual day adjustments) ----
  async function dayAdjustmentsForAccount(accountId){return await byIndex('tradingDayAdjustments','by_account',accountId);}
  async function getDayAdjustment(accountId,date){return await get('tradingDayAdjustments',`${accountId}_${date}`);}
  async function setDayAdjustment(accountId,date,result,amount){
    if(result==='none'){await del('tradingDayAdjustments',`${accountId}_${date}`);return null;}
    const amt=result==='loss'?-Math.abs(Number(amount)||0):Math.abs(Number(amount)||0);
    const n={id:`${accountId}_${date}`,accountId,date,result:result==='loss'?'loss':'gain',amount:amt,updatedAt:Date.now()};
    await put('tradingDayAdjustments',n);
    return n;
  }
  async function monthlyCalendarData(accountId,monthKey){
    const entries=await tradingEntriesForAccount(accountId);
    const adjustments=await dayAdjustmentsForAccount(accountId);
    const adjMap=Object.fromEntries(adjustments.map(a=>[a.date,a]));
    const entriesByDate={};
    for(const e of entries){(entriesByDate[e.date]=entriesByDate[e.date]||[]).push(e);}
    const allDates=new Set([...Object.keys(entriesByDate),...Object.keys(adjMap)]);
    const days={};
    for(const d of allDates){
      if(!d.startsWith(monthKey))continue;
      const dayEntries=entriesByDate[d]||[];
      const autoAmount=dayEntries.reduce((s,e)=>s+(Number(e.amount)||0),0);
      const adj=adjMap[d];
      const amount=adj?adj.amount:autoAmount;
      days[d]={count:dayEntries.length,autoAmount,amount,manual:!!adj};
    }
    const months=[...new Set([...allDates].map(d=>d.slice(0,7)))].sort();
    return {days,months};
  }

  async function finance(month){const f=await get('finance',month);return{id:month,income:(f&&Number(f.income))||0,expenses:(f&&f.expenses)||[],incomes:(f&&f.incomes)||[]};}
  async function setIncome(month,v){const f=await finance(month),n={...f,income:Number(v)||0};await put('finance',n);return n;}
  async function addExpense(month,x){const f=await finance(month),e={id:uid(),amount:Math.max(0,Number(x.amount)||0),description:x.description||'',date:x.date,method:x.method==='tarjeta'?'tarjeta':'efectivo'},n={...f,expenses:[e,...f.expenses]};await put('finance',n);return n;}
  async function deleteExpense(month,id){const f=await finance(month),n={...f,expenses:f.expenses.filter(x=>x.id!==id)};await put('finance',n);return n;}
  async function addIncome(month,x){const f=await finance(month),e={id:uid(),amount:Math.max(0,Number(x.amount)||0),description:x.description||'',date:x.date,method:x.method==='tarjeta'?'tarjeta':'efectivo'},n={...f,incomes:[e,...(f.incomes||[])]};await put('finance',n);return n;}

  async function updateMovie(id,patch){const cur=await get('movies',id);if(!cur)return null;const n={...cur,...patch,name:((patch.name??cur.name)||'').trim()||'Sin título',rating:Math.max(0,Math.min(10,Number(patch.rating??cur.rating)||0))};await put('movies',n);return n;}
  async function deleteMovie(id){await del('movies',id);}
  async function summary(date){
    const [d,n,t,w,c,r,tr]=await Promise.all([habitsForDate(date,'daily'),habitsForDate(date,'night'),tasksForDate(date),water(date),calories(date),running(date),trading(date)]);
    const f=await finance(date.slice(0,7));
    const de=f.expenses.filter(e=>e.date===date);
    const habitStatus=(await all('habitStatus')).some(x=>x.date===date && x.completed);
    const taskStatus=(await all('taskStatus')).some(x=>x.date===date && x.completed);
    const onceHabit=(await habits('daily')).concat(await habits('night')).some(x=>x.repeat==='once'&&x.onceDate===date);
    const onceTask=(await all('taskDefs')).some(x=>x.repeat==='once'&&x.date===date);
    const hasData=Boolean(
      w.glasses>0 || c.consumed>0 || r.ran || r.minutes>0 || r.km>0 || r.steps>0 ||
      tr.entries?.length || de.length || habitStatus || taskStatus || onceHabit || onceTask
    );
    return{date,hasData,habits:{done:[...d,...n].filter(x=>x.completed).length,total:d.length+n.length},tasks:{done:t.filter(x=>x.completed).length,total:t.length},water:w,calories:c,running:r,trading:tr,expensesTotal:de.reduce((a,b)=>a+b.amount,0),expenses:de};
  }

// Lunar phase is deliberately independent from weather and day/night.
// This uses geocentric ecliptic longitudes (low-precision astronomical model)
// rather than treating "night" or a weather value as a full-moon signal.
function lunarPhaseAngle(dateLike=Date.now()){
  const d=new Date(dateLike);
  if(!Number.isFinite(d.getTime()))return null;
  const epoch=Date.UTC(1999,11,31,12,0,0);
  const days=(d.getTime()-epoch)/86400000;
  const rad=Math.PI/180,deg=180/Math.PI;

  const inc=5.1454*rad;

  const a=60.2666,e=0.0549;
  const M=norm(115.3654+13.0649929509*days)*rad;

  return norm(moonLon-sunLon);

function moonPhaseFraction(dateLike=Date.now()){

function moonPhaseIcon(dateLike=Date.now()){

function getMoonPhaseState(dateLike=Date.now()){
  const angle=lunarPhaseAngle(dateLike);

  const index=Math.floor((angle+22.5)/45)%8;

  const distance=Math.abs(angle-180);

function weatherCodeInfo(code,isDay=true){

  const fullMoonIcon=moon.isFullMoon?'<span class="weather-final-moon" aria-label="Luna llena">🌕</span>':'';
  const a=d.alert&&(!d.alert.endsAt||d.alert.endsAt>Date.now())?d.alert:null;
  const alertClass=a?.level||'none';
  const last=d.updatedAt?weatherFmtTime(d.updatedAt):'';
  const temp=Number.isFinite(d.temperature)?`${Math.round(d.temperature)}°`:'—';
  const feel=Number.isFinite(d.apparentTemperature)?`Sens. ${Math.round(d.apparentTemperature)}°`:'Sens. —';
  const rain=Number.isFinite(d.precipProbability)?`${Math.round(d.precipProbability)}%`:'—';
  const rainN=Number.isFinite(d.precipProbability)?Number(d.precipProbability):null;
  const rainLabel=rainN===null?'':rainN<=20?'Baja probabilidad':rainN<=60?'Probabilidad media':'Alta probabilidad';
  const alertLabel=a?`Alerta ${a.label}`:'Sin alerta';
  return `<article class="card weather-card weather-${esc(alertClass)}" data-weather-bubble data-weather-level="${esc(alertClass)}" data-weather-rain-label="${esc(rainLabel)}" title="${esc(alertLabel)}${last?` · Actualizado ${last}`:''}" aria-label="Clima de Montevideo. Temperatura ${esc(temp)}, ${esc(feel)}, lluvia ${esc(rain)}. ${esc(alertLabel)}"><div class="weather-card-inner"><div class="weather-final-header"><div class="weather-final-place"><strong>Montevideo</strong></div><div class="weather-final-icons" aria-hidden="true"><span class="weather-final-icon">${code.icon}</span>${fullMoonIcon}</div></div><div class="weather-final-temp">${esc(temp)}</div><div class="weather-final-footer"><div class="weather-final-feel">${esc(feel)}</div><div class="weather-final-rain">💧 ${esc(rain)}</div></div></div></article>`;
}

let fitnessReminderUiTimer=null;

function fitnessWallTimeTimestamp(dateKey,hour=0,minute=0,second=0){
  const [y,m,d]=String(dateKey).split('-').map(Number);
  // Montevideo is required here as fixed UTC-3 for this feature.
  return Date.UTC(y,m-1,d,hour+3,minute,second,0);
}
function fitnessLocalDayStart(dateKey){return fitnessWallTimeTimestamp(dateKey,0,0,0);}
function fitnessNextMidnight(dateKey){return fitnessWallTimeTimestamp(L.addDays(dateKey,1),0,0,0);}

function fitnessDeviceName(settings){
  const name=String(settings?.fitnessDeviceName||'smartwatch').trim();
  return name||'smartwatch';
}

async function getFitnessReminderView(settings,now=Date.now()){
  if(settings?.fitnessReminderEnabled===false) return {visible:false};
  const today=L.today();
  const tomorrow=L.addDays(today,1);
  const nightStart=fitnessWallTimeTimestamp(today,23,0,0);
  const nextNightStart=fitnessWallTimeTimestamp(tomorrow,23,0,0);
  const device=fitnessDeviceName(settings);
  const suppressedUntil=Number(settings?.fitnessReminderSuppressedUntil)||0;

  if(suppressedUntil>now) return {visible:false,nextRefreshAt:suppressedUntil};

  const nightAlreadyConfirmed=settings?.fitnessReminderNightConfirmedDate===today;
  if(now>=nightStart && now<nextNightStart && !nightAlreadyConfirmed){
    return {
      visible:true,
      mode:'night',
      severity:'night',
      title:'Recordatorio nocturno',
      message:`Debes colocarte el ${esc(device)} para ir a dormir`,
      device,
      image:settings?.fitnessDeviceImage||FITNESS_DEFAULT_IMAGE,
      nextRefreshAt:fitnessNextMidnight(today)
    };
  }

  let startedAt=Number(settings?.fitnessReminderStartedAt)||0;
  if(!startedAt || startedAt>now){
    startedAt=now;
    await L.updateSettings({fitnessReminderStartedAt:startedAt,fitnessReminderSuppressedUntil:0});
  }

  const elapsed=Math.max(0,now-startedAt);
  const severity=elapsed>=2*FITNESS_HOUR_MS?'red':elapsed>=FITNESS_HOUR_MS?'orange':'normal';
  let nextRefreshAt=fitnessWallTimeTimestamp(today,23,0,0);
  if(nextRefreshAt<=now) nextRefreshAt=fitnessWallTimeTimestamp(tomorrow,23,0,0);
  if(severity==='normal') nextRefreshAt=Math.min(nextRefreshAt,startedAt+FITNESS_HOUR_MS);
  else if(severity==='orange') nextRefreshAt=Math.min(nextRefreshAt,startedAt+2*FITNESS_HOUR_MS);

  return {
    visible:true,
    mode:'normal',
    severity,
    title:severity==='red'?'Recordatorio pendiente':severity==='orange'?'Recordatorio pendiente':'No olvides tu aparato fitness',
    message:`¿Llevas contigo tu ${esc(device)}?`,
    device,
    image:settings?.fitnessDeviceImage||FITNESS_DEFAULT_IMAGE,
    nextRefreshAt
  };
}

async function fitnessReminderConfigModal(){

  const currentName=fitnessDeviceName(s);
  const body=`
    <img class="fitness-config-preview" id="fitness-config-preview" src="${esc(currentImage)}" alt="${esc(currentName)}">
    <div class="field">${field('Nombre del smartwatch / aparato fitness','fitnessDeviceName',s?.fitnessDeviceName||'','text','placeholder="Ej: Apple Watch" autocomplete="off"')}</div>
    <div class="field">

    </div>

    <div class="fitness-config-actions">
      <button type="button" class="btn btn-ghost btn-sm" data-fitness-use-default>Usar imagen predeterminada</button>
    </div>`;
  const m=modal('Configurar smartwatch',body,async wrap=>{
    const name=String(wrap.querySelector('[name="fitnessDeviceName"]')?.value||'').trim();
    const preview=wrap.querySelector('#fitness-config-preview');
    const image=preview?.dataset.pendingImage || s?.fitnessDeviceImage || '';
    await L.updateSettings({
      fitnessDeviceName:name||'smartwatch',
      fitnessDeviceImage:image
    });
    toast('Configuración del smartwatch guardada.');
    await render();
  },'Guardar');
  const fileInput=m.querySelector('[name="fitnessDeviceImage"]');
  const preview=m.querySelector('#fitness-config-preview');
  fileInput?.addEventListener('change',async e=>{
    const file=e.target.files?.[0];
    if(!file)return;
    try{
      const image=await optimizeFitnessImage(file);
      preview.src=image;
      preview.dataset.pendingImage=image;
    }catch(err){console.error(err);toast('No se pudo cargar la imagen.');}
  });

    preview.src=FITNESS_DEFAULT_IMAGE;
    preview.dataset.pendingImage=FITNESS_DEFAULT_IMAGE;
    if(fileInput)fileInput.value='';
  });
  return m;
}

function optimizeFitnessImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(reader.error||new Error('file'));
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        try{
          const max=600;
          const scale=Math.min(1,max/Math.max(img.naturalWidth||img.width, img.naturalHeight||img.height));
          const w=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));
          const h=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
          const canvas=document.createElement('canvas');
          canvas.width=w; canvas.height=h;
          const ctx=canvas.getContext('2d');
          if(!ctx) return resolve(reader.result);
          ctx.drawImage(img,0,0,w,h);
          const webp=canvas.toDataURL('image/webp',0.88);
          resolve(webp.startsWith('data:image/webp')?webp:canvas.toDataURL('image/png'));
        }catch(err){reject(err);}
      };
      img.onerror=()=>reject(new Error('image'));
      img.src=String(reader.result);
    };
    reader.readAsDataURL(file);
  });
}

async function confirmFitnessReminder(){
  const s=await L.settings();
  if(s?.fitnessReminderEnabled===false) return;
  const now=Date.now();
  const today=L.today();
  const nightStart=fitnessWallTimeTimestamp(today,23,0,0);
  const nextNightStart=fitnessWallTimeTimestamp(L.addDays(today,1),23,0,0);
  const isNight=now>=nightStart && now<nextNightStart && s?.fitnessReminderNightConfirmedDate!==today;
  const patch={
    fitnessReminderSuppressedUntil:now+FITNESS_SUPPRESS_MS,
    fitnessReminderStartedAt:0
  };
  if(isNight) patch.fitnessReminderNightConfirmedDate=today;
  await L.updateSettings(patch);
  toast(isNight?'Recordatorio nocturno confirmado.':'Recordatorio confirmado por 3 horas.');
  await render();
}

async function scheduleFitnessReminderUi(){
  clearTimeout(fitnessReminderUiTimer);
  fitnessReminderUiTimer=null;
  try{
    const s=await L.settings();
    if(s?.fitnessReminderEnabled===false) return;
    const now=Date.now();
    const view=await getFitnessReminderView(s,now);
    let target=view?.nextRefreshAt;
    if(!target) return;
    if(target<=now) target=now+1000;
    fitnessReminderUiTimer=setTimeout(async()=>{
      fitnessReminderUiTimer=null;
      try{
        if(state.screen==='home' && !document.querySelector('.modal-backdrop')) await render();
      }catch(err){console.error(err);}
    },Math.max(1000,target-now+50));
  }catch(err){console.error(err);}
}

let _defaultIconHref='',_defaultTouchIconHref='',_dynamicManifestUrl='';
function applyFaviconLogo(src){
  const iconEl=document.querySelector('link[rel="icon"]');
  const touchEl=document.querySelector('link[rel="apple-touch-icon"]');
  if(!_defaultIconHref&&iconEl)_defaultIconHref=iconEl.getAttribute('href');
  if(!_defaultTouchIconHref&&touchEl)_defaultTouchIconHref=touchEl.getAttribute('href');
  if(iconEl)iconEl.setAttribute('href',src||_defaultIconHref);
  if(touchEl)touchEl.setAttribute('href',src||_defaultTouchIconHref);
}
function isStandalonePwa(){return !!(window.navigator.standalone===true||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches));}
function absoluteManifestUrl(value,fallback){try{return new URL(value||fallback,location.href).href;}catch{return fallback;}}
async function loadBasePwaManifest(){
  try{
    const res=await fetch('./manifest.json',{cache:'no-store'});
    if(res.ok){const data=await res.json();if(data&&typeof data==='object')return data;}
  }catch{}
  const base=location.href.split('#')[0];
  return {name:'Centro',short_name:'Centro',start_url:base,scope:new URL('./',location.href).href,display:'standalone',background_color:'#000000',theme_color:'#000000',icons:[]};
}
function pwaManifestResponse(json){return new Response(json,{headers:{'Content-Type':'application/manifest+json;charset=utf-8','Cache-Control':'no-store'}});}
async function syncPwaManifest(src){
  try{
    const base=await loadBasePwaManifest();
    const manifest={...base};
    manifest.start_url=absoluteManifestUrl(base.start_url||'./',new URL('./',location.href).href);
    manifest.scope=absoluteManifestUrl(base.scope||'./',new URL('./',location.href).href);
    if(!manifest.id)manifest.id=manifest.start_url;
    // Keep the user's selected logo as the real app/launcher icon at 192px,
    // but use an all-black 512px icon for Android's system startup splash.
    // This removes the visible logo during the micro startup frame while
    // preserving the selected logo as the installed application's icon.
    const splashIcon={src:'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAIAAAB7GkOtAAADEUlEQVR42u3BgQAAAADDoPlTX+EAVQEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAMBvArQAAf/YBFAAAAAASUVORK5CYII=',sizes:'512x512',type:'image/png',purpose:'any'};
    if(src){
      const mime=String(src).match(/^data:([^;,]+)/i)?.[1]||'image/png';
      manifest.icons=[
        {src,sizes:'192x192',type:mime,purpose:'any'},
        {src,sizes:'192x192',type:mime,purpose:'maskable'},
        splashIcon
      ];
    } else if(Array.isArray(manifest.icons)&&manifest.icons.length){
      manifest.icons=[...manifest.icons,splashIcon];
    } else {
      manifest.icons=[splashIcon];
    }
    const json=JSON.stringify(manifest);
    const manifestUrl=new URL('./manifest.json',location.href).href;

    // Keep a same-origin manifest snapshot updated. If the existing Service Worker
    // serves manifest.json from Cache Storage, this lets it serve the selected icon.
    if('caches' in window){
      try{
        const cache=await caches.open('centro-pwa-manifest-overrides-v1');
        await cache.put(manifestUrl,pwaManifestResponse(json));
        const keys=await caches.keys();
        await Promise.all(keys.map(async name=>{
          try{
            const c=await caches.open(name);
            const reqs=await c.keys();
            for(const req of reqs){
              try{
                const u=new URL(req.url);
                if(u.origin===location.origin&&u.pathname===new URL(manifestUrl).pathname&&u.search===new URL(manifestUrl).search){
                  await c.put(req,pwaManifestResponse(json));
                }
              }catch{}
            }
          }catch{}
        }));
      }catch{}
    }

    // For a normal browser tab (before installation), expose the current
    // selection through a dynamic manifest. The original ./manifest.json
    // link remains the stable fallback and is restored by the browser on reload.
    const link=document.querySelector('#app-manifest')||document.querySelector('link[rel="manifest"]');
    if(link&&!isStandalonePwa()){
      if(_dynamicManifestUrl)URL.revokeObjectURL(_dynamicManifestUrl);
      _dynamicManifestUrl=URL.createObjectURL(new Blob([json],{type:'application/manifest+json'}));
      link.setAttribute('href',_dynamicManifestUrl);
    }
  }catch(e){console.warn('No se pudo sincronizar el manifiesto PWA',e);}
}
async function setAppLogo(src,label){
  try{
    if(src)await CentroDB.put('settings',{id:'appLogo',value:src,label:label||'Personalizado',updatedAt:Date.now()});
    else await CentroDB.del('settings','appLogo');
  }catch(e){console.error('No se pudo guardar el logo',e);toast('No se pudo guardar el logo.');return;}
  state.logo=src||'';
  state.logoLabel=src?(label||'Personalizado'):'';
  applyFaviconLogo(state.logo);
  syncPwaManifest(state.logo);
  await render();
}
async function logoPickerModal(){
  const current=state.logo||'';
  const wrap=document.createElement('div');
  wrap.className='modal-backdrop';
  wrap.innerHTML=`<div class="modal logo-picker-modal"><div class="modal-handle"></div><div class="row"><h2>Cambiar logo</h2><button class="icon-btn" data-close>✕</button></div><div class="modal-body"><p class="muted">Elige uno de los logos disponibles o sube una imagen personalizada desde tu dispositivo.</p><div class="logo-option-grid"><button type="button" class="logo-option ${!current?'active':''}" data-logo-default><div class="logo-option-thumb logo-option-empty">CENTRO</div><span>Predeterminado</span></button>${PRESET_LOGOS.map(p=>`<button type="button" class="logo-option ${current===p.src?'active':''}" data-logo-preset="${p.id}"><div class="logo-option-thumb"><img src="${p.src}" alt="${esc(p.name)}"></div><span>${esc(p.name)}</span></button>`).join('')}<button type="button" class="logo-option logo-option-upload" data-logo-upload><div class="logo-option-thumb logo-option-empty">📁</div><span>Subir imagen</span></button></div><input type="file" id="logo-upload-input" accept="image/*" style="display:none"></div><div class="modal-actions"><button class="btn btn-ghost btn-block" data-close>Cerrar</button></div></div>`;
  document.body.appendChild(wrap);
  wrap.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>wrap.remove());
  wrap.querySelector('[data-logo-default]').onclick=async()=>{await setAppLogo('','');wrap.remove();toast('Logo predeterminado aplicado.');};
  wrap.querySelectorAll('[data-logo-preset]').forEach(b=>b.onclick=async()=>{const p=PRESET_LOGOS.find(x=>x.id===b.dataset.logoPreset);if(p){await setAppLogo(p.src,p.name);wrap.remove();toast('Logo actualizado.');}});
  const fileInput=wrap.querySelector('#logo-upload-input');
  wrap.querySelector('[data-logo-upload]').onclick=()=>fileInput.click();
  fileInput.onchange=async()=>{
    const file=fileInput.files[0];
    if(!file)return;
    if(!file.type||!file.type.startsWith('image/')){toast('Selecciona un archivo de imagen válido.');return;}
    try{const dataUrl=await readImageFile(file);await setAppLogo(dataUrl,'Personalizado');wrap.remove();toast('Logo personalizado aplicado.');}
    catch{toast('No se pudo cargar la imagen.');}
  };
  return wrap;
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function empty(icon,text){return `<div class="empty-state"><div class="empty-glyph">${icon}</div>${esc(text)}</div>`;}
function dowMonday(dateStr){if(!dateStr)return 0;const [y,m,d]=dateStr.split('-').map(Number);const dt=new Date(Date.UTC(y,m-1,d,12));return (dt.getUTCDay()+6)%7;}
function monthName(monthKey){const [y,m]=monthKey.split('-').map(Number);return new Intl.DateTimeFormat('es-UY',{month:'long',year:'numeric',timeZone:'America/Montevideo'}).format(new Date(Date.UTC(y,m-1,1,12)));}
function shiftMonth(monthKey,delta){const [y,m]=monthKey.split('-').map(Number);const d=new Date(Date.UTC(y,m-1+delta,1,12));return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`;}
function financeDefaultDate(month){return month===state.date.slice(0,7)?state.date:`${month}-01`;}
function donutChart(segments){const total=segments.reduce((a,s)=>a+s.value,0),r=45,c=2*Math.PI*r,cx=60,cy=60;let offset=0;const circles=total>0?segments.filter(s=>s.value>0).map(s=>{const frac=s.value/total,len=c*frac,dashoffset=-offset;offset+=len;return `<circle cx="${cx}" cy="${cy}" r="${r}" stroke-width="14" fill="none" stroke="${s.color}" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${dashoffset}"></circle>`;}).join(''):`<circle cx="${cx}" cy="${cy}" r="${r}" stroke-width="14" fill="none" stroke="var(--bg-elev-3)"></circle>`;return `<svg width="120" height="120" viewBox="0 0 120 120" class="donut-chart">${circles}</svg>`;}
function weekStackedChart(dowLabels,rows,colorA,colorB){
  const maxDow=Math.max(1,...rows.map(r=>r.a+r.b));
  return `<div class="finance-week-chart">${dowLabels.map((lab,i)=>{
    const a=rows[i].a,b=rows[i].b,total=a+b;
    const pct=maxDow?Math.round(total/maxDow*100):0;
    const pctA=total?Math.round(a/total*100):0;
    const pctB=total?100-pctA:0;
    return `<div class="week-bar-col"><div class="week-bar-track"><div class="week-bar-fill" style="height:${pct}%">${total>0?`<div class="week-bar-seg" style="height:${pctA}%;background:${colorA}"></div><div class="week-bar-seg" style="height:${pctB}%;background:${colorB}"></div>`:''}</div></div><small>${esc(lab.slice(0,3))}</small></div>`;
  }).join('')}</div>`;

async function scheduleReminders(){
  reminderTimers.forEach(clearTimeout);
  reminderTimers=[];
  // Recordatorios de tareas con hora asignada (sección "Tareas")
  const todayTasks=await L.tasksForDate(L.today());
  const now=new Date();
  for(const t of todayTasks){
    if(t.completed || !t.def.time) continue;
    const [hh,mm]=String(t.def.time).split(':').map(Number);
    if(Number.isNaN(hh)||Number.isNaN(mm)) continue;
    const target=new Date();target.setHours(hh,mm,0,0);
    if(target<=now) continue;
    const ms=target-now;
    const taskId=t.def.id;
    reminderTimers.push(setTimeout(async()=>{
      const fresh=await L.tasksForDate(L.today());
      const cur=fresh.find(x=>x.def.id===taskId);
      if(cur && !cur.completed && await canNotify('tasks')){
        sendNotification(`☷ ${cur.def.name}`,cur.def.description||'Tienes una tarea pendiente.');
      }
    },ms));
  }
}

entListener('pointermove',e=>{if(!homeLayoutState.active){if(Math.hypot(e.clientX-homeLayoutState.downX,e.clientY-homeLayoutState.downY)>10)clearTimeout(homeLayoutState.longPressTimer);return;}if(homeLayoutState.draggingId&&homeLayoutState.draggingId!==id)return;homeLayoutState.draggingId=id;e.preventDefault();moveHomeBubble(id,e.clientX,e.clientY);});w.addEventListener('pointerup',e=>{if(homeLayoutState.longPressTimer){clearTimeout(homeLayoutState.longPressTimer);homeLayoutState.longPressTimer=null;return;}if(homeLayoutState.active&&homeLayoutState.selectedId===id){w.classList.remove('is-dragging');homeLayoutState.draggingId=null;homeLayoutState.blockClickUntil=Date.now()+600;board.querySelectorAll('.is-drop-target').forEach(x=>x.classList.remove('is-drop-target'));enforceHomeHeights();}});w.addEventListener('pointercancel',()=>{clearTimeout(homeLayoutState.longPressTimer);homeLayoutState.longPressTimer=null;w.classList.remove('is-dragging');homeLayoutState.draggingId=null;});});}

function renderChecklistPreview(items,type,emptyText,animMode){
  if(!items.length)return `<div class="mini-done">${emptyText}</div>`;
  const shown=items.slice(0,5);
  const rows=shown.map(x=>{
    if(type==='habits'&&animMode==='swipe'){
      return `<div class="check-row" data-row="${x.def.id}">${habitRowControl(x,'habits',animMode)}<div class="check-label">${esc(x.def.icon||'')} ${esc(x.def.name)}</div></div>`;

  }).join('');

function tradingChart(series, initialCapital){
  const pts=Array.isArray(series)&&series.length?series:[{date:'Inicio',time:'',capital:Number(initialCapital)||0,amount:0,result:0}];
  const width=900,height=260,padL=56,padR=18,padT=22,padB=34;
  const vals=pts.map(p=>Number(p.capital)||0);
  let min=Math.min(...vals),max=Math.max(...vals);
  if(min===max){ const bump=Math.max(100,Math.abs(min)*0.02||100); min-=bump; max+=bump; }
  const span=max-min||1;
  const x=i=>padL+(pts.length<=1?0:i*(width-padL-padR)/Math.max(1,pts.length-1));
  const y=v=>padT+(max-v)*(height-padT-padB)/span;
  const path=pts.map((p,i)=>`${i?'L':'M'} ${x(i).toFixed(2)} ${y(Number(p.capital)||0).toFixed(2)}`).join(' ');
  const area=`M ${x(0).toFixed(2)} ${height-padB} L ${pts.map((p,i)=>`${x(i).toFixed(2)} ${y(Number(p.capital)||0).toFixed(2)}`).join(' L ')} L ${x(pts.length-1).toFixed(2)} ${height-padB} Z`;
  const grid=[];
  for(let i=0;i<4;i++){
    const v=max-(span*i/3), yy=y(v);
    grid.push(`<line x1="${padL}" x2="${width-padR}" y1="${yy}" y2="${yy}" class="chart-grid"></line><text x="${padL-8}" y="${yy+4}" text-anchor="end" class="chart-y">${esc(money(v,'USD'))}</text>`);
  }
  const ticks=[0,Math.floor((pts.length-1)/2),pts.length-1].filter((v,i,a)=>a.indexOf(v)===i);
  const labels=ticks.map(i=>`<text x="${x(i)}" y="${height-10}" text-anchor="middle" class="chart-x">${esc(pts[i].date==='Inicio'?'Inicio':pts[i].date.slice(5))}</text>`).join('');
  const dots=pts.map((p,i)=>{
    const amount=Number(p.amount)||0;
    const title=`${p.date}${p.time?' · '+p.time:''} · ${amount>0?'+':''}${money(amount,'USD')} · ${money(p.capital,'USD')}`;
    const cy=y(Number(p.capital)||0);
    const marker=p.direction?`<text x="${x(i).toFixed(2)}" y="${(p.direction==='sell'?cy+16:cy-9).toFixed(2)}" text-anchor="middle" class="chart-marker ${p.direction==='sell'?'down':'up'}">${p.direction==='sell'?'SELL':'BUY'}</text>`:'';
    return `<circle cx="${x(i)}" cy="${cy}" r="${i===pts.length-1?5:3.5}" class="chart-dot ${amount>0?'up':amount<0?'down':''}"><title>${esc(title)}</title></circle>${marker}`;
  }).join('');
  return `<div class="chart-wrap"><svg class="trading-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="Evolución acumulada del capital"><defs><linearGradient id="equityFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--accent)" stop-opacity=".24"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>${grid.join('')}<path d="${area}" class="chart-area"></path><path d="${path}" class="chart-line"></path>${dots}${labels}</svg><div class="chart-labels"><span>${pts.length} puntos</span><span>Capital actual: ${esc(money(pts[pts.length-1].capital,'USD'))}</span></div></div>`;
}

function evalLabel(t){return t==='1fase'?'1 fase':t==='2fases'?'2 fases':'Sin fase';}
function tradingDayBars(entries){
  const month=L.today().slice(0,7);
  const dim=L.daysInMonth(month);
  const map={};
  for(const e of entries){if(e.date && e.date.slice(0,7)===month)map[e.date]=(map[e.date]||0)+(Number(e.amount)||0);}
  const vals=Object.values(map).map(v=>Math.abs(v));
  const max=Math.max(1,...vals);
  let bars='';
  for(let d=1;d<=dim;d++){
    const key=`${month}-${String(d).padStart(2,'0')}`;
    const v=map[key]||0;
    const h=v?Math.max(6,Math.round(Math.abs(v)/max*54)):3;
    bars+=`<div class="day-bar-col"><div class="day-bar ${v>0?'up':v<0?'down':'flat'}" style="height:${h}px" title="${esc(L.shortDate(key))}: ${v?money(v,'USD'):'sin datos'}"></div></div>`;
  }
  return `<div class="day-bars-wrap"><div class="day-bars">${bars}</div></div>`;
}
function monthLabel(monthKey){
  const [y,m]=monthKey.split('-').map(Number);
  const s=new Intl.DateTimeFormat('es-UY',{month:'long',year:'numeric',timeZone:'America/Montevideo'}).format(new Date(Date.UTC(y,m-1,1,12)));
  return cap(s);
}
function tradingCalendarGrid(accountId,monthKey,daysData){
  const [y,m]=monthKey.split('-').map(Number);
  const numDays=L.daysInMonth(monthKey);
  const firstDow=new Date(Date.UTC(y,m-1,1,12)).getUTCDay();
  const cells=[];
  for(let i=0;i<firstDow;i++)cells.push('<div class="cal-cell cal-empty"></div>');
  for(let d=1;d<=numDays;d++){
    const dateKey=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const info=daysData[dateKey];
    const isToday=dateKey===L.today();
    if(info){
      const cls=info.amount>0?'gain':info.amount<0?'loss':'';
      cells.push(`<button class="cal-cell cal-day has-data ${cls} ${isToday?'is-today':''}" data-cal-day="${accountId}|${dateKey}"><span class="cal-daynum">${d}</span>${info.count?`<span class="cal-ops">${info.count} op.</span>`:info.manual?'<span class="cal-ops">ajuste</span>':''}<span class="cal-amount">${info.amount>=0?'+':''}${esc(money(info.amount,'USD'))}</span></button>`);
    } else {
      cells.push(`<button class="cal-cell cal-day ${isToday?'is-today':''}" data-cal-day="${accountId}|${dateKey}"><span class="cal-daynum">${d}</span></button>`);
    }
  }
  return cells.join('');
}
function tradingCalendarSection(acc,monthKey,calData){
  const {days,months}=calData;

  const idx=allMonths.indexOf(monthKey);
  const canPrev=idx>0;
  const canNext=idx>=0&&idx<allMonths.length-1;

    ${section('Rendimiento mensual')}
    <div class="cal-nav"><button class="icon-btn" data-cal-prev="${acc.id}" ${canPrev?'':'disabled'}>‹</button><strong>${esc(monthLabel(monthKey))}</strong><button class="icon-btn" data-cal-next="${acc.id}" ${canNext?'':'disabled'}>›</button></div>

  </article>`;
}

function tradingDonut(buyCount,sellCount){
  const total=buyCount+sellCount;
  const buyPct=total?Math.round(buyCount/total*100):0;
  const sellPct=total?100-buyPct:0;
  const r=54,circ=2*Math.PI*r;
  const buyLen=total?circ*(buyCount/total):0;
  return `<div class="donut-wrap">
    <svg viewBox="0 0 140 140" class="trading-donut" role="img" aria-label="Proporción BUY vs SELL">
      <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--red)" stroke-width="16"></circle>
      <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--green)" stroke-width="16" stroke-dasharray="${buyLen.toFixed(2)} ${(circ-buyLen).toFixed(2)}" transform="rotate(-90 70 70)"></circle>
      <text x="70" y="66" text-anchor="middle" class="donut-center-big">${total?buyPct+'%':'—'}</text>
      <text x="70" y="84" text-anchor="middle" class="donut-center-small">BUY</text>
    </svg>
    <div class="donut-legend">
      <span class="legend-item"><span class="legend-dot" style="background:var(--green)"></span>BUY ${buyCount} (${buyPct}%)</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--red)"></span>SELL ${sellCount} (${sellPct}%)</span>
    </div>
  </div>`;
}
function tradingDowBars(dowMap){
  const order=[1,2,3,4,5,6,0];
  const labels={1:'Lunes',2:'Martes',3:'Miércoles',4:'Jueves',5:'Viernes',6:'Sábado',0:'Domingo'};
  const vals=order.map(d=>Math.abs(dowMap[d]||0));
  const max=Math.max(1,...vals);
  let bars='';
  for(const d of order){
    const v=dowMap[d]||0;
    const h=v?Math.max(6,Math.round(Math.abs(v)/max*58)):3;
    bars+=`<div class="dow-bar-col"><div class="dow-bar ${v>0?'up':v<0?'down':'flat'}" style="height:${h}px" title="${esc(labels[d])}: ${v?money(v,'USD'):'sin datos'}"></div><small>${esc(labels[d].slice(0,3))}</small></div>`;
  }
  return `<div class="dow-bars-wrap"><div class="dow-bars">${bars}</div></div>`;
}

async function tradingScreen(){
  const accounts=await L.tradingAccounts();
  let cards='';
  for(const acc of accounts){
    const stats=await L.tradingAccountStats(acc.id);
    if(acc.minimized){
      cards+=accountMiniCard(acc,stats);
    } else {
      const [pts,allEntries]=await Promise.all([L.accountEquity(acc.id),L.tradingEntriesForAccount(acc.id)]);
      const todayEntries=allEntries.filter(e=>e.date===state.date);
      const open=!!(state.tradingStatsOpen&&state.tradingStatsOpen[acc.id]);
      let calMonth=null,calData=null;
      if(open){
        calMonth=(state.tradingCalendarMonth&&state.tradingCalendarMonth[acc.id])||L.today().slice(0,7);
        calData=await L.monthlyCalendarData(acc.id,calMonth);
      }
      cards+=accountFullCard(acc,stats,pts.slice(-50),todayEntries,allEntries,calMonth,calData);
    }
  }
  return `<main class="screen">${section('Trading',`<button class="btn btn-ghost btn-sm" data-add-trading-account>+ Cuenta</button>`)}${accounts.length?cards:`<article class="card">${empty('📈','Todavía no agregaste ninguna cuenta de trading.')}<button class="btn btn-primary btn-block" style="margin-top:12px" data-add-trading-account>+ Agregar cuenta</button></article>`}</main>`;
}
async function tradingAccountModal(id){
  const acc=id?await L.getTradingAccount(id):null;
  const evalOpts=[['1fase','1 fase'],['2fases','2 fases'],['sinfase','Sin fase']];
  const brokerOpts=[['FTMO','FTMO'],['FundingPips','FundingPips'],['Apex','Apex'],['Otros','Otros']];
  const knownBrokers=['FTMO','FundingPips','Apex'];
  const brokerIsOther=!!(acc?.broker && !knownBrokers.includes(acc.broker));
  const brokerSelectVal=acc?.broker?(brokerIsOther?'Otros':acc.broker):'FTMO';
  const body=`
    ${field('Nombre / etiqueta de la cuenta','name',acc?.name||'','text','required placeholder="Ej: Cuenta FTMO 10K"')}
    <div class="field"><label>Tipo de cuenta</label><div class="segmented" id="account-type-toggle"><button type="button" class="${(acc?.type||'real')==='real'?'active':''}" data-account-type="real">Real</button><button type="button" class="${acc?.type==='fondeo'?'active':''}" data-account-type="fondeo">Fondeo</button></div></div>
    ${field('Capital inicial','initialCapital',acc?.initialCapital??'','number','min="0" step="1" required')}
    ${field('Activo (ej: NASDAQ, US100, XAUUSD, EURUSD)','instrument',acc?.instrument||'')}
    <div id="fondeo-fields" style="display:${acc?.type==='fondeo'?'block':'none'}">
      ${selectField('Broker / empresa de fondeo','brokerSelect',brokerSelectVal,brokerOpts)}
      <div class="field" id="broker-other-field" style="display:${brokerIsOther?'block':'none'}">${field('Nombre del broker','brokerOther',brokerIsOther?acc.broker:'')}</div>
      ${field('Plataforma','platform',acc?.platform||'MetaTrader 5')}
      ${field('Pérdida máxima diaria','dailyLossMax',acc?.dailyLossMax??'','number','min="0" step="1"')}
      ${field('Pérdida máxima total','totalLossMax',acc?.totalLossMax??'','number','min="0" step="1"')}
      ${field('Objetivo de ganancia','profitTarget',acc?.profitTarget??'','number','min="0" step="1"')}
      ${selectField('Tipo de evaluación','evalType',acc?.evalType||'2fases',evalOpts)}
      ${field('Fase actual','phase',acc?.phase??1,'number','min="1" step="1"')}
    </div>`;
  const w=modal(id?'Editar cuenta':'Nueva cuenta de trading',body,async wrap=>{
    const name=wrap.querySelector('[name=name]').value.trim();
    if(!name){toast('Escribe un nombre para la cuenta.');return false;}
    const type=wrap.querySelector('[data-account-type].active')?.dataset.accountType||'real';
    const initialCapital=Number(wrap.querySelector('[name=initialCapital]').value)||0;
    const instrument=wrap.querySelector('[name=instrument]').value.trim();
    const patch={name,type,initialCapital,instrument};
    if(type==='fondeo'){
      const brokerSel=wrap.querySelector('[name=brokerSelect]').value;
      patch.broker=brokerSel==='Otros'?wrap.querySelector('[name=brokerOther]').value.trim():brokerSel;
      patch.platform=wrap.querySelector('[name=platform]').value.trim();
      patch.dailyLossMax=Number(wrap.querySelector('[name=dailyLossMax]').value)||0;
      patch.totalLossMax=Number(wrap.querySelector('[name=totalLossMax]').value)||0;
      patch.profitTarget=Number(wrap.querySelector('[name=profitTarget]').value)||0;
      patch.evalType=wrap.querySelector('[name=evalType]').value;
      patch.phase=Number(wrap.querySelector('[name=phase]').value)||1;
    } else {
      patch.broker='';patch.platform='';patch.dailyLossMax=0;patch.totalLossMax=0;patch.profitTarget=0;patch.evalType='sinfase';patch.phase=1;
    }
    if(id)await L.updateTradingAccount(id,patch);
    else await L.createTradingAccount(patch);
    toast(id?'Cuenta actualizada.':'Cuenta creada.');
    await render();
  },id?'Guardar cambios':'Crear cuenta');
  w.querySelectorAll('[data-account-type]').forEach(b=>b.onclick=()=>{w.querySelectorAll('[data-account-type]').forEach(x=>x.classList.remove('active'));b.classList.add('active');w.querySelector('#fondeo-fields').style.display=b.dataset.accountType==='fondeo'?'block':'none';});
  w.querySelector('[name=brokerSelect]')?.addEventListener('change',e=>{const f=w.querySelector('#broker-other-field');if(f)f.style.display=e.target.value==='Otros'?'block':'none';});
}
