async function tradingDayModal(accountId,date){
  const entries=(await L.tradingEntriesForAccount(accountId)).filter(e=>e.date===date);
  if(!entries.length){
    const adj=await L.getDayAdjustment(accountId,date);
    tradingEntryFormModal(accountId,date,null,adj);
    return;
  }
  tradingDayDetailModal(accountId,date,entries);
}
function tradingDayDetailModal(accountId,date,entries){
  const wrap=document.createElement('div');
  wrap.className='modal-backdrop';
  const rows=entries.map(e=>`<div class="money-row" data-entry-row="${e.id}"><span>${esc(e.time||'')} · ${e.direction==='sell'?'SELL':'BUY'} · ${e.result==='gain'?'Ganancia':e.result==='loss'?'Pérdida':'Breakeven'}</span><span class="row-right"><strong class="${e.amount>0?'gain':e.amount<0?'loss':''}">${e.amount>=0?'+':''}${esc(money(e.amount,'USD'))}</strong><button class="icon-btn" data-edit-entry="${e.id}" title="Editar">✎</button></span></div>`).join('');
  wrap.innerHTML=`<div class="modal"><div class="modal-handle"></div><div class="row"><h2>${esc(L.shortDate(date))}</h2><button class="icon-btn" data-close>✕</button></div><div class="modal-body"><div class="reminder-list">${rows}</div></div><div class="modal-actions"><button class="btn btn-ghost" data-close>Cerrar</button><button class="btn btn-primary" data-add-day-entry>+ Agregar operación</button></div></div>`;
  document.body.appendChild(wrap);
  wrap.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>wrap.remove());
  wrap.querySelectorAll('[data-edit-entry]').forEach(b=>b.onclick=()=>{const entry=entries.find(x=>x.id===b.dataset.editEntry);wrap.remove();tradingEntryFormModal(accountId,date,entry,null);});
  wrap.querySelector('[data-add-day-entry]').onclick=()=>{wrap.remove();tradingEntryFormModal(accountId,date,null,null);};
  return wrap;
}
async function tradingEntryFormModal(accountId,date,entry,legacyAdj){
  const curResult=entry?entry.result:(legacyAdj?legacyAdj.result:'gain');
  const curDir=entry?entry.direction:'buy';
  const curAmount=entry?Math.abs(entry.amount):(legacyAdj?Math.abs(legacyAdj.amount):'');
  const body=`
    <div class="field"><label>Resultado</label><div class="segmented" id="day-entry-result"><button type="button" class="${curResult!=='loss'?'active':''}" data-entry-result="gain">Ganancia</button><button type="button" class="${curResult==='loss'?'active':''}" data-entry-result="loss">Pérdida</button></div></div>
    <div class="field"><label>Tipo de operación</label><div class="segmented" id="day-entry-dir"><button type="button" class="${curDir!=='sell'?'active':''}" data-entry-dir="buy">BUY</button><button type="button" class="${curDir==='sell'?'active':''}" data-entry-dir="sell">SELL</button></div></div>
    ${field('Importe ($)','amount',curAmount,'number','min="0.01" step="0.01" inputmode="decimal" required')}
    ${legacyAdj&&!entry?'<p class="muted" style="margin-top:8px">Este día tenía un ajuste manual anterior. Al guardar se convertirá en una operación real de trading.</p>':''}`;
  const w=modal(entry?`Editar operación · ${esc(L.shortDate(date))}`:`Nueva operación · ${esc(L.shortDate(date))}`,body,async wrap=>{
    const amount=Number(wrap.querySelector('[name=amount]').value);
    if(!(amount>0)){toast('Introduce un importe válido.');return false;}
    const outcome=wrap.querySelector('[data-entry-result].active')?.dataset.entryResult||'gain';
    const direction=wrap.querySelector('[data-entry-dir].active')?.dataset.entryDir||'buy';
    if(entry){
      await L.updateTradingEntry(entry.id,{direction,outcome,amount});
      toast('Operación actualizada.');
    } else {
      await L.addAccountTradingEntry(accountId,{direction,outcome,amount,date});
      if(legacyAdj)await L.setDayAdjustment(accountId,date,'none',0);
      toast('Operación registrada.');
    }
    await render();
  },entry?'Guardar cambios':'Guardar');
  w.querySelectorAll('[data-entry-result]').forEach(b=>b.onclick=()=>{w.querySelectorAll('[data-entry-result]').forEach(x=>x.classList.remove('active'));b.classList.add('active');});
  w.querySelectorAll('[data-entry-dir]').forEach(b=>b.onclick=()=>{w.querySelectorAll('[data-entry-dir]').forEach(x=>x.classList.remove('active'));b.classList.add('active');});
  if(entry){
    const delBtn=document.createElement('button');
    delBtn.type='button';
    delBtn.className='btn btn-danger btn-block';
    delBtn.style.marginTop='10px';
    delBtn.textContent='Eliminar operación';
    delBtn.onclick=async()=>{
      if(confirm('¿Eliminar esta operación?')){
        await L.deleteTradingEntry(entry.id);
        w.remove();
        toast('Operación eliminada.');
        await render();
      }
    };
    w.querySelector('.modal-body').appendChild(delBtn);
  }
}

async function financeScreen(){
  const s=await L.settings();
  const month=state.financeMonth||state.date.slice(0,7);
  const curMonth=state.date.slice(0,7);
  const f=await L.finance(month);
  const filter=state.financeMethodFilter||'all';
  const spent=f.expenses.reduce((a,e)=>a+e.amount,0);
  const gained=f.incomes.reduce((a,e)=>a+e.amount,0);
  const balance=(Number(f.income)||0)+gained-spent;
  const spentEfectivo=f.expenses.filter(e=>(e.method||'efectivo')==='efectivo').reduce((a,e)=>a+e.amount,0);
  const spentTarjeta=f.expenses.filter(e=>(e.method||'efectivo')==='tarjeta').reduce((a,e)=>a+e.amount,0);
  const gainedEfectivo=f.incomes.filter(e=>(e.method||'efectivo')==='efectivo').reduce((a,e)=>a+e.amount,0);
  const gainedTarjeta=f.incomes.filter(e=>(e.method||'efectivo')==='tarjeta').reduce((a,e)=>a+e.amount,0);
  const dowLabels=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  const dowExpEfectivo=[0,0,0,0,0,0,0], dowExpTarjeta=[0,0,0,0,0,0,0];
  f.expenses.forEach(e=>{const i=dowMonday(e.date);if((e.method||'efectivo')==='tarjeta')dowExpTarjeta[i]+=e.amount;else dowExpEfectivo[i]+=e.amount;});
  const dowIncEfectivo=[0,0,0,0,0,0,0], dowIncTarjeta=[0,0,0,0,0,0,0];
  f.incomes.forEach(e=>{const i=dowMonday(e.date);if((e.method||'efectivo')==='tarjeta')dowIncTarjeta[i]+=e.amount;else dowIncEfectivo[i]+=e.amount;});
  const expenseRows=dowLabels.map((_,i)=>({a:dowExpEfectivo[i],b:dowExpTarjeta[i]}));
  const incomeRows=dowLabels.map((_,i)=>({a:dowIncEfectivo[i],b:dowIncTarjeta[i]}));
  const monthOptions=Array.from(new Set([...(await L.financeMonths()),curMonth,month])).filter(mo=>mo<=curMonth).sort().reverse();
  const movements=[...f.incomes.map(x=>({...x,kind:'income'})),...f.expenses.map(x=>({...x,kind:'expense'}))].sort((a,b)=>(b.date||'').localeCompare(a.date||''));

async function settingsScreen(){const s=await L.settings();const habitAnim=s.habitCompletionAnimation||'circle';const uiScale=getUiScale();const sideMargin=getSideMargin();const isMobileDevice=getIsMobileDevice();return `<main class="screen">${section('Ajustes')}<article class="card">${section('Apariencia')}<div class="segmented"><button class="${s.theme==='dark'?'active':''}" data-theme="dark">🌙 Oscuro</button><button class="${s.theme==='light'?'active':''}" data-theme="light">☀️ Claro</button><button class="${s.theme==='system'?'active':''}" data-theme="system">⚙ Sistema</button></div><button class="setting-row" data-change-logo><span>🖼️ Cambiar logo</span><strong>${state.logo?(state.logoLabel||'Personalizado'):'Predeterminado'}</strong></button><div class="scale-row"><div class="scale-row-head"><span>🔍 Escalado visual de la web</span><strong id="ui-scale-value">${uiScale}</strong></div><input type="range" class="scale-slider" id="ui-scale-range" min="1" max="10" step="1" value="${uiScale}"><div class="scale-labels"><span>1 · Alejado</span><span>5 · Normal</span><span>10 · Cercano</span></div></div><div class="scale-row"><div class="scale-row-head"><span>📱 Tipo de dispositivo</span></div><div class="segmented" id="device-type-toggle"><button type="button" class="${!isMobileDevice?'active':''}" data-device-type="desktop">🖥️ No es celular</button><button type="button" class="${isMobileDevice?'active':''}" data-device-type="mobile">📱 Celular</button></div></div>${isMobileDevice?'':`<div class="scale-row"><div class="scale-row-head"><span>↔️ Margen lateral</span><strong id="side-margin-value">${sideMargin}px</strong></div><input type="range" class="scale-slider" id="side-margin-range" min="0" max="60" step="5" value="${sideMargin}"><div class="scale-labels"><span>0 · Sin margen</span><span>30 · Medio</span><span>60 · Máximo</span></div></div>`}</article><article class="card gemini-api-card">${section('API Key de Gemini')}<p class="fitness-settings-note">La clave se guarda localmente en este dispositivo y no se incluye en el código de la aplicación.</p><div class="gemini-api-status ${hasGeminiApiKey()?'good':'muted'}">${hasGeminiApiKey()?'✓ API Key configurada':'API Key no configurada'}</div><div class="field"><label>Ingresar API Key</label><input data-gemini-api-key-input type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false" placeholder="Pega tu API Key de Gemini"></div><div class="gemini-api-actions"><button type="button" class="btn btn-primary" data-save-gemini-api-key>Guardar</button><button type="button" class="btn btn-danger" data-delete-gemini-api-key ${hasGeminiApiKey()?'':'disabled'}>Eliminar API Key</button></div></article><article class="card tmdb-api-card">${section('API de TMDB')}<p class="fitness-settings-note">Usa una credencial de TMDB guardada localmente para buscar películas/series y obtener sus portadas oficiales.</p><div class="tmdb-api-status ${hasTmdbCredential()?'good':'muted'}">${hasTmdbCredential()?'✓ Credencial de TMDB configurada':'Credencial de TMDB no configurada'}</div><div class="field"><label>Tipo de credencial</label><div class="segmented"><button type="button" class="${getTmdbAuthMode()==='bearer'?'active':''}" data-tmdb-mode="bearer">Read Access Token</button><button type="button" class="${getTmdbAuthMode()==='api_key'?'active':''}" data-tmdb-mode="api_key">API Key</button></div></div><div class="field"><label>Credencial de TMDB</label><input data-tmdb-credential-input type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false" placeholder="Pega tu credencial de TMDB"></div><div class="tmdb-api-actions"><button type="button" class="btn btn-primary" data-save-tmdb-credential>Guardar</button><button type="button" class="btn btn-danger" data-delete-tmdb-credential ${hasTmdbCredential()?'':'disabled'}>Eliminar</button></div></article><article class="card fitness-settings-card">${section('Recordatorio de uso de aparato fitness')}<p class="fitness-settings-note">Controla el recordatorio del smartwatch que aparece en Inicio. Se guarda en este dispositivo.</p><div class="segmented"><button type="button" class="${s.fitnessReminderEnabled!==false?'active':''}" data-fitness-toggle="1">Sí</button><button type="button" class="${s.fitnessReminderEnabled===false?'active':''}" data-fitness-toggle="0">No</button></div><div class="setting-row"><span>⌚ Dispositivo</span><strong class="fitness-setting-badge">${esc(fitnessDeviceName(s))}</strong></div></article><article class="card weather-settings-card">${section('Clima')}<p class="fitness-settings-note">Muestra el clima fijo de Montevideo en Inicio. Se actualiza como máximo una vez por hora.</p><div class="segmented"><button type="button" class="${s.showWeather!==false?'active':''}" data-weather-toggle="1">Sí</button><button type="button" class="${s.showWeather===false?'active':''}" data-weather-toggle="0">No</button></div></article><article class="card">${section('Objetivos')}<button class="setting-row" data-edit-water><span>💧 Agua</span><strong>${s.waterGoalGlasses} vasos · ${s.glassSizeMl} ml</strong></button><button class="setting-row" data-edit-cal-goal><span>🔥 Calorías</span><strong>${s.caloriesGoal} kcal</strong></button><button class="setting-row" data-edit-weight><span>⚖️ Peso para estimaciones</span><strong>${s.weightKg||70} kg</strong></button></article><article class="card">${section('Pestañas visibles')}<p class="muted">Elige qué secciones aparecen en la navegación de abajo. Se guarda en este dispositivo.</p><div class="reminder-list">${NAV_ITEMS.map(([id,ic,lab])=>`<div class="setting-row"><span>${ic} ${lab}</span><span class="row-right"><input type="checkbox" data-tab-toggle="${id}" ${getVisibleTabs()[id]!==false?'checked':''}></span></div>`).join('')}</div></article><article class="card">${section('Animación de realización de hábitos')}<p class="muted">Elige cómo marcas un hábito como realizado.</p><div class="segmented"><button class="${habitAnim==='circl async function render(){if(!state._init)state._init=true;if(state.screen!=='home'){clearTimeout(weatherRefreshTimer);weatherRefreshTimer=null;document.querySelector('[data-home-layout-editor]')?.remove();homeLayoutState.active=false;homeLayoutState.selectedId=null;homeLayoutState.draggingId=null;}document.documentElement.dataset.theme=state.theme;const prevScreenEl=document.querySelector('.screen');const samScreen=_lastRenderedScreen===state.screen;const prevScrollTop=(samScreen&&prevScreenEl)?prevScreenEl.scrollTop:0;const prevNavEl=document.querySelector('.bottom-nav');const prevNavScrollLeft=prevNavEl?prevNavEl.scrollLeft:0;let body='';if(state.screen==='home')body=await home();else if(state.screen==='habits')body=await habitsScreen();else if(state.screen==='tasks')body=await tasksScreen();else if(state.screen==='gym')body=await gymScreen();else if(state.screen==='movies')body=await moviesScreen();else if(state.screen==='trading')body=await tradingScreen();else if(state.screen==='calories')body=await caloriesScreen();else if(state.screen==='finance')body=await financeScreen();else if(state.screen==='links')body=await linksScreen();else if(state.screen==='news')body=await newsScreen();else if(state.screen==='water')body=await waterScreen();else if(state.screen==='running')body=await runningScreen();else if(state.screen==='notes')body=await notesScreen();else if(state.screen==='history')body=await historyScreen();else if(state.screen==='settings')body=await settingsScreen();const secondary=['water','notes','history','settings'].includes(state.screen);document.querySelector('#root').innerHTML=`${header(secondary?({'water':'Agua','notes':'Notas','history':'Historial','settings':'Ajustes'}[state.screen]):'',secondary)}${body}${bottomNav()}<div id="toast"></div>`;bind();_lastRenderedScreen=state.screen;const newScreenEl=document.querySelector('.screen');if(newScreenEl&&samScreen)newScreenEl.scrollTop=prevScrollTop;const newNavEl=document.querySelector('.bottom-nav');if(newNavEl)newNavEl.scrollLeft=prevNavScrollLeft;scheduleFitnessReminderUi();if(state.screen==='home'){bindHomeBubbleEditor();requestAnimationFrame(()=>{applyHomeLayoutPreview();enforceHomeHeights();});}}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));document.querySelectorAll('[data-habit],[data-night-habit]').forEach(b=>b.onclick=async()=>{const id=b.dataset.habit||b.dataset.nightHabit;await L.toggleHabit(id,state.date);render();});document.querySelectorAll('[data-task]').forEach(b=>b.onclick=async()=>{await L.toggleTask(b.dataset.task,state.date);scheduleReminders();render();});document.querySelectorAll('[data-delete-habit]').forEach(b=>b.onclick=async()=>{if(confirm('¿Eliminar este hábito?')){await L.deleteHabit(b.dataset.deleteHabit);render();}});document.querySelectorAll('[data-move-habit]').forEach(b=>b.onclick=async()=>{const [type,id,direction]=b.dataset.moveHabit.split(':');await L.moveHabit(type,id,direction);render();});document.querySelectorAll('[data-delete-task]').forEach(b=>b.onclick=async()=>{if(confirm('¿Eliminar esta tarea?')){await L.deleteTask(b.dataset.deleteTask);scheduleReminders();render();}});
  document.querySelectorAll('button[data-theme]').forEach(b=>b.onclick=async()=>{const t=b.dataset.theme;setTheme(t);await L.updateSettings({theme:t});render();});
  const uiScaleRange=document.getElementById('ui-scale-range');if(uiScaleRange){uiScaleRange.oninput=()=>{const v=uiScaleRange.value;applyUiScale(v);const label=document.getElementById('ui-scale-value');if(label)label.textContent=v;};uiScaleRange.onchange=()=>{setUiScale(uiScaleRange.value);};}
  const sideMarginRange=document.getElementById('side-margin-range');if(sideMarginRange){sideMarginRange.oninput=()=>{const v=sideMarginRange.value;applySideMargin(v);const label=document.getElementById('side-margin-value');if(label)label.textContent=v+'px';};sideMarginRange.onchange=()=>{setSideMargin(sideMarginRange.value);};}
  document.querySelectorAll('[data-device-type]').forEach(b=>b.onclick=()=>{setIsMobileDevice(b.dataset.deviceType==='mobile');render();});
  document.querySelectorAll('[data-weather-toggle]').forEach(b=>b.onclick=async()=>{const enabled=b.dataset.weatherToggle==='1';const next={showWeather:enabled};if(!enabled){clearTimeout(weatherRefreshTimer);weatherRefreshTimer=null;}await L.updateSettings(next);toast(enabled?'Clima activado.':'Clima desactivado.');await render();});
  document.querySelectorAll('button[data-habit-anim]').forEach(b=>b.onclick=async()=>{await L.updateSettings({habitCompletionAnimation:b.dataset.habitAnim});render();});
  document.querySelectorAll('[data-swipe-habit]').forEach(track=>{
    const thumb=track.querySelector('.swipe-thumb');
    if(!thumb)return;
    let startX=0,dragging=false;
    const maxX=()=>Math.max(0,track.clientWidth-thumb.offsetWidth-4);
    thumb.onpointerdown=e=>{dragging=true;startX=e.clientX;try{thumb.setPointerCapture(e.pointerId);}catch(_){}thumb.style.transition='none';};
    thumb.onpointermove=e=>{if(!dragging)return;const m=maxX();const dx=Math.min(Math.max(e.clientX-startX,0),m);thumb.style.transform=`translateX(${dx}px)`;track.classList.toggle('swipe-ready',m>0&&dx>=m*0.85);};
    const finish=async e=>{
      if(!dragging)return;dragging=false;thumb.style.transition='';
      const m=maxX();const clientX=(e&&typeof e.clientX==='number')?e.clientX:startX;
      const dx=Math.min(Math.max(clientX-startX,0),m);
      if(m>0&&dx>=m*0.6){
        thumb.style.transform=`translateX(${m}px)`;track.classList.add('swipe-ready');
        const id=track.dataset.swipeHabit;
        await L.toggleHabit(id,state.date);
        render();
      } else {
        thumb.style.transform='translateX(0px)';track.classList.remove('swipe-ready');
      }
    };
    thumb.onpointerup=finish;
    thumb.onpointercancel=()=>{dragging=false;thumb.style.transition='';thumb.style.transform='translateX(0px)';track.classList.remove('swipe-ready');};
  });

    const enabled=b.dataset.fitnessToggle==='1';

      patch.fitnessReminderStartedAt=Date.now();

    await render();
  });
  $('[data-fitness-confirm]')?.addEventListener('click',async e=>{e.preventDefault();e.stopPropagation();await confirmFitnessReminder();});
  document.querySelectorAll('[data-fitness-image-tap]').forEach(el=>{
    let lastTap=0;
    el.onpointerup=e=>{
      if(homeLayoutState.active)return;
      if(e.pointerType==='mouse' && e.button!==0)return;

        e.preventDefault();

  $('#save-run')?.addEventListener('click',async()=>{const yes=document.querySelector('[data-run].active')?.dataset.run==='yes';await L.setRunning(state.date,yes,$('#kmInput')?.value||0);toast('Running guardado.');render();});
  document.querySelectorAll('[data-trade-result]').forEach(b=>b.onclick=async()=>{
    const result=b.dataset.tradeResult;
    if(result==='gain'||result==='loss'){
      modal(result==='gain'?'Registrar ganancia':'Registrar pérdida',field('Monto del resultado (USD)','amount','', 'number','min="0.01" step="0.01" inputmode="decimal" required'),async m=>{

        if(!(amount>0)){toast('Introduce un monto válido.');return false;}

        await render();
      },'Guardar resultado');

    await L.setTrading(state.date,result,0);
    toast(result==='breakeven'?'Breakeven guardado.':'Día marcado como sin operar.');

function validateMovieAiResult(result){

function readImageAsDataUrl(file){
  return new Promise((resolve,reject)=>{
    if(!(file instanceof File))return reject(geminiError('invalid-image','not-a-file'));
    if(!file.type||!/^image\/(jpeg|jpg|png|webp)$/i.test(file.type))return reject(geminiError('invalid-image-type',file.type||'missing-type'));
    if(file.size<=0)return reject(geminiError('invalid-image','empty-file'));
    if(file.size>GEMINI_IMAGE_MAX_BYTES)return reject(geminiError('image-too-large',String(file.size)));
    geminiDebug('2. Imagen seleccionada',{mime:file.type,sizeBytes:file.size,sizeKB:Math.round(file.size/1024)});
    const reader=new FileReader();
    reader.onerror=()=>reject(geminiError('image-read'));
    reader.onload=()=>{
      const source=String(reader.result||'');
      if(!source.startsWith('data:'))return reject(geminiError('image-read','data-url-missing'));
      const img=new Image();
      img.onload=()=>{try{
        const nw=img.naturalWidth||img.width||0,nh=img.naturalHeight||img.height||0;
        geminiDebug('3. Imagen válida',{mime:file.type,sizeBytes:file.size,width:nw,height:nh});
        if(!nw||!nh)return reject(geminiError('invalid-image','missing-dimensions'));
        const scale=Math.min(1,GEMINI_IMAGE_MAX_EDGE/Math.max(nw,nh));
        const w=Math.max(1,Math.round(nw*scale)),h=Math.max(1,Math.round(nh*scale));
        const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');if(!ctx)return reject(geminiError('image-process','canvas-context'));
        ctx.drawImage(img,0,0,w,h);
        const dataUrl=canvas.toDataURL('image/jpeg',0.82);
        if(!dataUrl.startsWith('data:image/jpeg;base64,'))return reject(geminiError('image-process','jpeg-encode'));
        const base64=dataUrl.slice(dataUrl.indexOf(',')+1);if(!base64||base64.length<100)return reject(geminiError('image-process','empty-base64'));
        geminiDebug('4. Imagen preparada',{mime:'image/jpeg',width:w,height:h,base64Generated:true,base64Length:base64.length});
        resolve({mimeType:'image/jpeg',data:base64,preview:dataUrl,width:w,height:h,sourceSizeBytes:file.size});
      }catch(err){reject(geminiError('image-process',err?.message||''));}};
      img.onerror=()=>reject(geminiError('invalid-image','decode-failed'));img.src=source;
    };
    reader.readAsDataURL(file);
  });
}
async function geminiFetchJson(url,init,stage='fetch',timeoutMs=GEMINI_FETCH_TIMEOUT_MS){
  const controller=new AbortController(),started=performance.now();
  const timer=setTimeout(()=>controller.abort(),timeoutMs);
  try{return{response:await fetch(url,{...init,signal:controller.signal,mode:'cors',cache:'no-store'}),elapsedMs:Math.round(performance.now()-started)};}
  catch(err){if(err?.name==='AbortError')throw geminiError(stage==='model-check'?'model-check-timeout':'timeout-fetch');geminiDebug('ERROR de fetch',{stage,name:err?.name||'Error',message:err?.message||'fetch failed',elapsedMs:Math.round(performance.now()-started)});throw geminiError(stage==='model-check'?'model-check-failed':'fetch-failed',err?.message||'fetch failed');}
  finally{clearTimeout(timer);}
}
async function verifyGeminiModel(apiKey){

  let raw='';try{raw=await response.text();}catch{throw geminiError('model-check-failed','response-read-failed');}
  let payload=null;if(raw){try{payload=JSON.parse(raw);}catch{payload=null;}}
  if(!response.ok){const msg=typeof payload?.error?.message==='string'?payload.error.message:'HTTP '+response.status;geminiDebug('ERROR verificación modelo',{status:response.status,message:msg});if(response.status===401||response.status===403)throw geminiError('invalid-key',msg);if(response.status===404)throw geminiError('model-unavailable',msg);if(response.status===429)throw geminiError('quota',msg);if(response.status>=500)throw geminiError('service',msg);throw geminiError('model-check-failed',msg);}

}
function extractGeminiInteractionText(payload){
  if(typeof payload?.output_text==='string'&&payload.output_text.trim())return payload.output_text.trim();
  const steps=Array.isArray(payload?.steps)?payload.steps:[];
  for(let i=steps.length-1;i>=0;i--){const step=steps[i];if(step?.type!=='model_output')continue;const blocks=Array.isArray(step.content)?step.content:[];const txt=blocks.filter(b=>b?.type==='text'&&typeof b.text==='string').map(b=>b.text).join('').trim();if(txt)return txt;}
  return '';
}

  // Interactions can complete synchronously, but the API also exposes an in_progress state.
  // Poll that interaction without blocking the UI indefinitely.
  if(payload?.status==='in_progress' && payload?.id){

      geminiDebug('7.2 Estado de interacción',{status:poll?.status||'unknown',attempt,contentType:pollType});

function geminiUserError(err){
  switch(geminiErrorCode(err)){
    case 'missing-key': return 'Primero debes configurar tu API Key de Gemini en Ajustes.';
    case 'file-origin': return 'La app está abierta como archivo local. Sírvela mediante HTTP/HTTPS para usar Gemini.';
    case 'invalid-key': return 'La API Key no es válida.';
    case 'model-unavailable': return 'El modelo de Gemini configurado no está disponible.';
    case 'bad-request': return 'La solicitud a Gemini no es válida. Inténtalo nuevamente.';
    case 'model-check-failed': return 'No se pudo verificar el modelo de Gemini. Revisa tu conexión e inténtalo nuevamente.';
    case 'model-check-timeout': return 'No se pudo verificar el modelo de Gemini a tiempo. Revisa tu conexión e inténtalo nuevamente.';
    case 'quota': return 'Se alcanzó el límite o la cuota de Gemini. Inténtalo nuevamente más tarde.';
    case 'fetch-failed': return 'No se pudo conectar con Gemini. Inténtalo nuevamente.';
    case 'connection': return 'No se pudo conectar con Gemini. Inténtalo nuevamente.';
    case 'timeout-fetch': return 'No se pudo completar el análisis. Revisa tu conexión e inténtalo nuevamente.';
    case 'timeout-body': return 'No se pudo completar el análisis. Revisa tu conexión e inténtalo nuevamente.';
    case 'timeout-poll': return 'El análisis está tardando demasiado. Inténtalo nuevamente.';
    case 'service': return 'El servicio de Gemini no está disponible en este momento. Inténtalo nuevamente.';
    case 'invalid-image': return 'La imagen no es válida para el análisis.';
    case 'image-too-large': return 'La imagen es demasiado grande. Selecciona una imagen más pequeña.';
    case 'invalid-image-type': return 'La imagen seleccionada no es válida.';
    case 'image-read': return 'No se pudo leer la imagen. Selecciónala nuevamente.';
    case 'image-process': return 'No se pudo preparar la imagen para el análisis.';
    case 'invalid-json': return 'Gemini no devolvió un resultado válido.';
    case 'invalid-response': return 'Gemini no devolvió un resultado válido.';
    case 'invalid-data': return 'Los datos nutricionales recibidos no son válidos.';
    case 'nutrition-save': return 'No se pudo guardar la nutrición en Centro de Calorías.';
    default: return 'Ocurrió un error durante el análisis. Inténtalo nuevamente.';
  }
}
async function geminiFoodPhotoModal(){
  const body=`
    <div class="gemini-food-preview-wrap">
      <div class="gemini-food-empty" id="gemini-food-empty">Selecciona o toma una foto de la comida.</div>
      <img class="gemini-food-preview" id="gemini-food-preview" alt="Vista previa de la comida" style="display:none">
    </div>
    <div class="gemini-food-picker">
      <button type="button" class="btn btn-ghost" data-gemini-camera>📷 Tomar foto</button>
      <button type="button" class="btn btn-ghost" data-gemini-gallery>🖼️ Galería</button>
      <input class="gemini-food-file" id="gemini-camera-input" type="file" accept="image/jpeg,image/png,image/webp" capture="environment">
      <input class="gemini-food-file" id="gemini-gallery-input" type="file" accept="image/jpeg,image/png,image/webp">
    </div>
    ${field('¿Qué comida es? (opcional)','foodDescription','','text','placeholder="Ej: arroz con pollo" autocomplete="off"')}
  `;
  let preparedImage=null;
  const wrap=modal('Analizar comida con IA',body,async modalWrap=>{
    geminiDebug('0. Usuario pulsó Analizar');
    const apiKeyNow=getGeminiApiKey();
    if(!apiKeyNow){
      geminiDebug('ERROR en etapa 1',{code:'missing-key'});
      modalWrap.remove();
      go('settings');
      toast('Primero configura tu API Key de Gemini en Ajustes.');
      return false;
    }
    if(!preparedImage){
      geminiDebug('ERROR antes de etapa 5',{code:'no-prepared-image'});
      toast('Primero selecciona o toma una foto de la comida.');
      return false;
    }
    const saveBtn=modalWrap.querySelector('#modalSave');
    const cancelBtns=modalWrap.querySelectorAll('[data-close]');
    if(saveBtn){saveBtn.disabled=true;saveBtn.textContent='Analizando…';saveBtn.setAttribute('aria-busy','true');}
    cancelBtns.forEach(b=>b.disabled=true);
    try{
      const description=modalWrap.querySelector('[name="foodDescription"]')?.value||'';
      if(description.trim())geminiDebug('Descripción opcional incluida',{descriptionIncluded:true});
      else geminiDebug('Descripción opcional vacía',{descriptionIncluded:false});
      const nutrition=await analizarComidaConGemini(preparedImage,description);
      geminiDebug('9. Registrando nutrición mediante función existente');
      try{
        await L.addCalories(state.date,nutrition.calorias,{fat:nutrition.grasas_g,protein:nutrition.proteinas_g,carbs:nutrition.carbohidratos_g});
      }catch(err){
        geminiDebug('ERROR en etapa 9',{code:'nutrition-save',message:err?.message||'save-failed'});
        throw geminiError('nutrition-save');
      }
      geminiDebug('10. Nutrición guardada en Centro de Calorías');
      toast('Comida analizada y agregada a Calorías.');
      try{
        await render();
        geminiDebug('11. Centro de Calorías actualizado');
      }catch(err){
        geminiDebug('ERROR en etapa 11',{code:'render',message:err?.message||'render-failed'});
        toast('La comida se guardó, pero no se pudo actualizar la pantalla. Recarga la página.');
      }
      return true;
    }catch(err){
      if(saveBtn){saveBtn.disabled=false;saveBtn.textContent='Analizar';saveBtn.removeAttribute('aria-busy');}
      cancelBtns.forEach(b=>b.disabled=false);
      const code=geminiErrorCode(err);
      geminiDebug('ERROR en proceso de análisis',{code,detail:err?.geminiDetail||''});
      toast(geminiUserError(err));
      return false;
    }
  },'Analizar');
  const preview=wrap.querySelector('#gemini-food-preview');
  const empty=wrap.querySelector('#gemini-food-empty');
  const camera=wrap.querySelector('#gemini-camera-input');
  const gallery=wrap.querySelector('#gemini-gallery-input');
  const saveBtn=wrap.querySelector('#modalSave');
  const setFile=async file=>{
    if(!file)return;
    if(!(file instanceof File)){toast('La imagen seleccionada no es válida.');return;}
    if(!/^image\/(jpeg|jpg|png|webp)$/i.test(file.type)){toast('La imagen seleccionada no es válida.');return;}
    if(file.size<=0){toast('La imagen seleccionada no es válida.');return;}
    if(file.size>GEMINI_IMAGE_MAX_BYTES){toast('La imagen es demasiado grande. Selecciona una imagen más pequeña.');return;}
    try{
      if(saveBtn)saveBtn.disabled=true;
      const image=await readImageAsDataUrl(file);
      preparedImage=image;
      if(preview){preview.src=image.preview;preview.style.display='';}
      if(empty)empty.style.display='none';
      if(saveBtn)saveBtn.disabled=false;
      geminiDebug('4. Preview lista',{width:image.width,height:image.height,previewReady:true});
    }catch(err){
      preparedImage=null;
      if(preview){preview.removeAttribute('src');preview.style.display='none';}
      if(empty)empty.style.display='';
      if(saveBtn)saveBtn.disabled=false;
      geminiDebug('ERROR en preparación de imagen',{code:geminiErrorCode(err)});
      toast(geminiUserError(err));
    }
  };
  wrap.querySelector('[data-gemini-camera]')?.addEventListener('click',()=>camera?.click());
  wrap.querySelector('[data-gemini-gallery]')?.addEventListener('click',()=>gallery?.click());
  camera?.addEventListener('change',async e=>{await setFile(e.target.files?.[0]);e.target.value='';});
  gallery?.addEventListener('change',async e=>{await setFile(e.target.files?.[0]);e.target.value='';});
  return wrap;
}

const TMDB_CREDENTIAL_STORAGE='tmdb_credential';

function setTmdbCredential(value){try{const c=String(value||'').trim();if(c)localStorage.setItem(TMDB_CREDENTIAL_STORAGE,c);else localStorage.removeItem(TMDB_CREDENTIAL_STORAGE);return true;}catch{return false;}}
async function tmdbCredentialSave(){const input=document.querySelector('[data-tmdb-credential-input]');const value=String(input?.value||'').trim();if(!value){toast('Ingresa una credencial de TMDB.');input?.focus();return;}if(!setTmdbCredential(value)){toast('No se pudo guardar la credencial de TMDB en este dispositivo.');return;}tmdbDebug('Credencial guardada localmente',{mode:getTmdbAuthMode()});toast('Credencial de TMDB guardada.');await render();}

async function tmdbFetchJson(path,params={},stage='request'){
  const credential=getTmdbCredential();if(!credential)throw new Error('tmdb-missing-credential');
  const url=new URL(TMDB_API_BASE+path);for(const[k,v]of Object.entries(params||{}))if(v!==undefined&&v!==null&&v!=='')url.searchParams.set(k,String(v));
  const headers={Accept:'application/json'};if(getTmdbAuthMode()==='bearer')headers.Authorization='Bearer '+credential;else url.searchParams.set('api_key',credential);
  const ctl=new AbortController(),started=performance.now(),tid=setTimeout(()=>ctl.abort(),TMDB_FETCH_TIMEOUT_MS);

function tmdbUserError(err){const code=err?.message;const status=err?.tmdbStatus;if(code==='tmdb-missing-credential')return'Configura tu API de TMDB en Ajustes.';if(code==='tmdb-timeout')return'TMDB tardó demasiado en responder. Inténtalo nuevamente.';if(code==='tmdb-invalid-json')return'TMDB devolvió una respuesta inválida.';if(code==='tmdb-response-read')return'No se pudo leer la respuesta de TMDB.';if(status===401||status===403)return'La credencial de TMDB no es válida.';if(status===404)return'El contenido solicitado no está disponible en TMDB.';if(status===429)return'TMDB indicó un límite de solicitudes. Inténtalo nuevamente más tarde.';if(status>=500)return'TMDB no está disponible en este momento.';return'No se pudo consultar TMDB. Inténtalo nuevamente.';}
async function getTmdbImageBase(){if(tmdbConfigCache?.base)return tmdbConfigCache.base;const cfg=await tmdbFetchJson('/configuration',{},'configuration');const images=cfg?.images||{};const base=images.secure_base_url||images.base_url;const sizes=Array.isArray(images.poster_sizes)?images.poster_sizes:[];if(!base||!sizes.length)throw new Error('tmdb-image-config');const preferred=['w500','w342','w780','w185'].find(s=>sizes.includes(s))||sizes.find(s=>/^w\d+$/.test(s));if(!preferred)throw new Error('tmdb-image-config');tmdbConfigCache={base,size:preferred};return tmdbConfigCache;}
function tmdbPosterUrl(posterPath,config){if(!posterPath||!config?.base||!config?.size)return'';return config.base+config.size+posterPath;}
function normalizeSearchTitle(value){return String(value||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();}
function scoreTmdbCandidate(ai,c){const target=normalizeSearchTitle(ai.titulo);const titles=[c.title,c.name,c.original_title,c.original_name].filter(Boolean).map(normalizeSearchTitle);let titleScore=0;for(const t of titles){if(t===target){titleScore=Math.max(titleScore,1);continue;}if(t.includes(target)||target.includes(t)){titleScore=Math.max(titleScore,.86);continue;}const a=new Set(target.split(' ')),b=new Set(t.split(' '));const overlap=[...a].filter(x=>b.has(x)).length/Math.max(a.size,b.size,1);titleScore=Math.max(titleScore,.72*overlap);}const candidateYear=Number(String(c.release_date||c.first_air_date||'').slice(0,4))||0;let yearScore=0;if(ai.anio&&candidateYear){const diff=Math.abs(ai.anio-candidateYear);yearScore=diff===0?.14:diff===1?.08:diff===2?.03:0;}const popularity=Math.min(.05,Math.log10(Math.max(1,Number(c.popularity)||0))/20);return titleScore*.8+yearScore+popularity;}
async function searchTmdbForMovieAi(ai){
  tmdbDebug('1. Preparando búsqueda',{title:ai.titulo,type:ai.tipo,year:ai.anio||0});
  if(ai.tipo==='youtube')return{kind:'youtube',candidates:[]};
  const endpoint=ai.tipo==='serie'?'/search/tv':'/search/movie';const yearParam=ai.tipo==='serie'?'first_air_date_year':'primary_release_year';let data=await tmdbFetchJson(endpoint,{query:ai.titulo,include_adult:false,language:'es-ES',page:1,...(ai.anio?{[yearParam]:ai.anio}:{})},'search');let results=Array.isArray(data.results)?data.results:[];if(!results.length&&ai.anio){tmdbDebug('2. Sin resultados con año; reintentando sin filtro de año');data=await tmdbFetchJson(endpoint,{query:ai.titulo,include_adult:false,language:'es-ES',page:1},'search-no-year');results=Array.isArray(data.results)?data.results:[];}const scored=results.filter(c=>c&&((ai.tipo==='serie'&&c.media_type!=='movie')||(ai.tipo==='pelicula'&&c.media_type!=='tv'))).map(c=>({item:c,score:scoreTmdbCandidate(ai,c)})).sort((a,b)=>b.score-a.score);tmdbDebug('3. Coincidencias TMDB',{count:scored.length,topScore:scored[0]?.score||0});return{kind:'tmdb',candidates:scored.slice(0,5).map(x=>x.item),scores:scored.slice(0,5).map(x=>x.score)};}

async function movieSearchWithAi(w){
  const query=String(w.querySelector('[data-movie-ai-query]')?.value||w.querySelector('[name=name]')?.value||'').trim();if(!query){toast('Escribe un nombre o una descripción para buscar con IA.');return;}

    const prompt=`Identifica el contenido audiovisual descrito por el usuario. Devuelve exclusivamente el objeto definido por el esquema JSON. Usa exactamente los valores internos permitidos para tipo y exactamente las categorías permitidas. Calificación y estado no son parte de tu respuesta: la aplicación los establecerá localmente. Si no puedes determinar el año, usa 0. Descripción del usuario: ${JSON.stringify(query)}`;

    if(!search.candidates.length||search.scores?.[0]<0.55)throw Object.assign(new Error('tmdb-no-match'),{tmdbStatus:404});
    const top=search.candidates[0],topScore=search.scores[0]||0,secondScore=search.scores[1]||0;geminiDebug('Movies AI 3. Coincidencia seleccionada',{tmdbMatch:true,confidence:topScore});

  }catch(err){geminiDebug('Movies AI ERROR',{code:err?.message||'unexpected',status:err?.tmdbStatus||''});toast(err?.message==='tmdb-no-match'?'No se encontró una coincidencia suficientemente buena en TMDB.':err?.message==='movie-invalid-data'?'Gemini devolvió datos de película no válidos.':err?.message?.startsWith('tmdb-')?tmdbUserError(err):geminiUserError(err));}
  finally{if(btn){btn.disabled=false;btn.textContent='✨ Buscar con IA';btn.classList.remove('movie-ai-loading');}if(status&&!status.textContent?.startsWith('Contenido'))status.textContent='';}
}

  wrap.innerHTML=`<div class="modal movie-detail"><div class="modal-handle"></div><div class="row"><h2>${esc(m.name)}</h2><button class="icon-btn" data-close>✕</button></div><div class="modal-body">${m.cover?`<img class="movie-cover-large" src="${m.cover}" alt="${esc(m.name)}">`:`<div class="movie-cover-large movie-cover-empty">🎬</div>`}<div class="movie-detail-stars">${movieStars(m.rating)}<span class="muted">${m.rating||0}/10</span></div><div class="movie-detail-info"><div class="movie-detail-row"><span>Tipo</span><strong>${esc(movieTypeLabel(m.type))}</strong></div>${m.year?`<div class="movie-detail-row"><span>Año</span><strong>${esc(m.year)}</strong></div>`:''}<div class="movie-detail-row"><span>Categoría</span><strong>${esc(Array.isArray(m.categories)&&m.categories.length?m.categories.join(', '):m.category)}</strong></div><div class="movie-detail-row"><span>Estado</span><strong>${m.watched?'Vista':'No vista'}</strong></div></div>${m.description?`<div class="movie-detail-desc">${esc(m.description)}</div>`:''}</div><div class="modal-actions"><button class="btn btn-ghost" data-toggle-watched>${m.watched?'Marcar no vista':'Marcar vista'}</button><button class="btn btn-primary" data-edit-this-movie>Editar</button></div><button class="btn btn-danger btn-block" style="margin-top:10px" data-delete-this-movie>Eliminar</button></div>`;
  document.body.appendChild(wrap);
  wrap.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>wrap.remove());
  wrap.querySelector('[data-edit-this-movie]').onclick=()=>{wrap.remove();movieModal(m.id);};
  wrap.querySelector('[data-toggle-watched]').onclick=async()=>{await L.updateMovie(m.id,{watched:!m.watched});wrap.remove();render();};
  wrap.querySelector('[data-delete-this-movie]').onclick=async()=>{if(confirm('¿Eliminar este contenido de la lista?')){await L.deleteMovie(m.id);wrap.remove();render();}};
  return wrap;
}
async function openMovieDetail(id){const m=await L.getMovie(id);if(!m){toast('No se encontró el contenido.');return;}movieDetailModal(m);}
async function movieFiltersModal(){
  const cats=L.MOVIE_CATEGORIES;
  const f=state.movieFilters||{};
  const body=`
    <div class="field"><label>Calificación mínima</label><div class="segmented" id="movie-filter-rating">${[[0,'Todas'],[7,'7+'],[8,'8+'],[9,'9+'],[10,'10']].map(([v,l])=>`<button type="button" class="${(f.minRating||0)===v?'active':''}" data-filter-rating="${v}">${esc(l)}</button>`).join('')}</div></div>
    ${selectField('Categoría','category',f.category||'',[['','Todas'],...cats.map(c=>[c,c])])}
    ${selectField('Tipo','type',f.type||'',[['','Todos'],...L.MOVIE_TYPES])}
    <div class="field"><label>Estado</label><div class="segmented" id="movie-filter-watched">${[['','Todas'],['watched','Vistas'],['unwatched','No vistas']].map(([v,l])=>`<button type="button" class="${(f.watched||'')===v?'active':''}" data-filter-watched="${v}">${esc(l)}</button>`).join('')}</div></div>
  `;
  const w=modal('Filtros',body,async wrap=>{
    const minRating=Number(wrap.querySelector('[data-filter-rating].active')?.dataset.filterRating)||0;
    const category=wrap.querySelector('[name=category]').value;
    const type=wrap.querySelector('[name=type]').value;
    const watched=wrap.querySelector('[data-filter-watched].active')?.dataset.filterWatched||'';
    state.movieFilters={minRating:minRating||null,category:category||null,type:type||null,watched:watched||null};
    toast('Filtros aplicados.');
    await render();
  },'Aplicar');
  w.querySelectorAll('[data-filter-rating]').forEach(b=>b.onclick=()=>{w.querySelectorAll('[data-filter-rating]').forEach(x=>x.classList.remove('active'));b.classList.add('active');});
  w.querySelectorAll('[data-filter-watched]').forEach(b=>b.onclick=()=>{w.querySelectorAll('[data-filter-watched]').forEach(x=>x.classList.remove('active'));b.classList.add('active');});
  const clearBtn=document.createElement('button');
  clearBtn.type='button';
  clearBtn.className='btn btn-ghost btn-block';
  clearBtn.style.marginTop='10px';
  clearBtn.textContent='Quitar filtros';
  clearBtn.onclick=async()=>{state.movieFilters=null;w.remove();toast('Filtros eliminados.');await render();};
  w.querySelector('.modal-body').appendChild(clearBtn);
}
async function tradingConfigModal(){const c=await L.tradingConfig();modal('Configuración de trading',`${field('Instrumento','instrument',c.instrument)}${field('Capital inicial','initialCapital',c.initialCapital,'number','min="0" step="1"')}${selectField('Moneda','currency',c.currency,[['USD','USD'],['UYU','UYU'],['EUR','EUR']])}${field('Hora de trading','tradingTime',c.tradingTime,'time')}`,async m=>{await L.updateTradingConfig({instrument:m.querySelector('[name=instrument]').value||'NASDAQ',initialCapital:Number(m.querySelector('[name=initialCapital]').value)||0,currency:m.querySelector('[name=currency]').value,tradingTime:m.querySelector('[name=tradingTime]').value});toast('Configuración actualizada.');render();});}
async function clearAllModal(){
  const w=modal('Confirmar eliminación',`<p class="muted">Esta acción eliminará TODOS los datos locales de Centro: hábitos, tareas, agua, calorías, running, trading, finanzas, gimnasio, enlaces, notas e historial.</p><p><strong>Para confirmar que realmente quieres eliminar todos tus datos, escribe todos los números del 1 al 9 en orden:</strong></p><div class="field"><label>Confirmación</label><input name="delete-confirm" type="text" inputmode="numeric" autocomplete="off" maxlength="9" placeholder="123456789" aria-label="Escribe 123456789 para confirmar"></div>`,async m=>{
    const value=(m.querySelector('[name=\"delete-confirm\"]')?.value||'').trim();
    if(value!=='123456789'){toast('Escribe 123456789 en orden para confirmar.');return false;}
    for(const s of Object.keys(CentroDB.STORES))await CentroDB.clear(s);
    localStorage.removeItem('centro-theme');
    location.reload();
  },'Eliminar todos los datos');
  const saveBtn=w.querySelector('#modalSave');
  if(saveBtn){saveBtn.classList.remove('btn-primary');saveBtn.classList.add('btn-danger');}
  const input=w.querySelector('[name=\"delete-confirm\"]');
  if(input){
    input.addEventListener('input',()=>{input.value=input.value.replace(/\D/g,'').slice(0,9);});
    setTimeout(()=>input.focus(),50);
  }
}
function isDateInRange(date,from,to){return typeof date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(date)&&date>=from&&date<=to;}
function filterExportRows(storeName,rows,from,to){
  const dateStores=new Set(['habitStatus','taskStatus','water','calories','running','trading','tradingDayAdjustments','nytStatus','notes']);
  if(dateStores.has(storeName))return rows.filter(row=>isDateInRange(row?.date,from,to));
  if(storeName==='finance')return rows.filter(row=>{const month=String(row?.id||'');if(!/^\d{4}-\d{2}$/.test(month))return false;const monthEnd=`${month}-${String(L.daysInMonth(month)).padStart(2,'0')}`;const monthStart=`${month}-01`;if(monthEnd<from||monthStart>to)return false;return true;}).map(row=>({...row,expenses:Array.isArray(row.expenses)?row.expenses.filter(x=>isDateInRange(x?.date,from,to)):[],incomes:Array.isArray(row.incomes)?row.incomes.filter(x=>isDateInRange(x?.date,from,to)):[]}));
  return rows;
}
async function exportDataToFile(){
  const today=L.today();
  const wrap=document.createElement('div');
  wrap.className='modal-backdrop';
  wrap.innerHTML=`<div class="modal export-range-modal"><div class="modal-handle"></div><div class="row"><h2>Descargar datos</h2><button class="icon-btn" data-close>✕</button></div><div class="modal-body"><p class="muted">Elige qué período quieres incluir en el archivo de datos.</p><div class="segmented" style="margin-bottom:14px"><button type="button" class="active" data-export-range-mode="today">📅 Hoy</button><button type="button" data-export-range-mode="custom">🗓️ Personalizado</button></div><div class="field" data-export-date-field style="display:none"><label>Desde</label><input type="date" data-export-from value="${today}"></div><div class="field" data-export-date-field style="display:none"><label>Hasta</label><input type="date" data-export-to value="${today}"></div><div class="muted" style="font-size:11px;line-height:1.5" data-export-range-help>Se descargan los datos registrados durante el día de hoy.</div></div><div class="modal-actions"><button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" data-export-confirm>Descargar</button></div></div>`;
  document.body.appendChild(wrap);
  wrap.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>wrap.remove());
  const modeButtons=wrap.querySelectorAll('[data-export-range-mode]');
  const dateFields=wrap.querySelectorAll('[data-export-date-field]');
  const help=wrap.querySelector('[data-export-range-help]');
  const setMode=mode=>{
    modeButtons.forEach(b=>b.classList.toggle('active',b.dataset.exportRangeMode===mode));
    const custom=mode==='custom';
    dateFields.forEach(f=>f.style.display=custom?'block':'none');
    if(help)help.textContent=custom?'Selecciona la fecha inicial y final. Se incluirán los registros comprendidos entre ambas fechas.':'Se descargan los datos registrados durante el día de hoy.';
  };
  modeButtons.forEach(b=>b.onclick=()=>setMode(b.dataset.exportRangeMode));
  wrap.querySelector('[data-export-confirm]').onclick=async()=>{
    try{
      const mode=wrap.querySelector('[data-export-range-mode].active')?.dataset.exportRangeMode||'today';
      let from=today,to=today;
      if(mode==='custom'){
        from=wrap.querySelector('[data-export-from]')?.value||'';
        to=wrap.querySelector('[data-export-to]')?.value||'';
        if(!from||!to){toast('Selecciona ambas fechas.');return;}
        if(from>to){toast('La fecha inicial no puede ser posterior a la fecha final.');return;}
      }
      const data={};
      for(const storeName of Object.keys(CentroDB.STORES)){
        const rows=await CentroDB.all(storeName);
        data[storeName]=filterExportRows(storeName,rows,from,to);
      }
      const payload={app:'centro',version:2,exportedAt:new Date().toISOString(),exportRange:{mode,from,to},data};
      const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      a.download=mode==='today'?`centro-datos-hoy-${today}.json`:`centro-datos-${from}-a-${to}.json`;
      document.body.appendChild(a);a.click();a.remove();
      URL.revokeObjectURL(url);
      wrap.remove();
      toast('Datos descargados.');
    }catch(err){console.error(err);alert('No se pudo generar el archivo de datos.');}
  };
}
async function importDataFromFile(file){
  try{
    const text=await file.text();
    const payload=JSON.parse(text);
    const data=(payload&&typeof payload==='object'&&payload.data&&typeof payload.data==='object')?payload.data:payload;
    if(!data||typeof data!=='object')throw new Error('invalid');
    if(!confirm('Esto reemplazará TODOS tus datos actuales (hábitos, tareas, agua, calorías, running, trading, finanzas, gimnasio, notas, etc.) por los del archivo seleccionado. Tus preferencias visuales (tema, escalado, pestañas visibles) no se modificarán. ¿Continuar?'))return;
    for(const storeName of Object.keys(CentroDB.STORES)){
      if(storeName==='settings')continue;
      const rows=data[storeName];
      if(!Array.isArray(rows))continue;
      await CentroDB.clear(storeName);
      for(const row of rows)await CentroDB.put(storeName,row);
    }
    if(Array.isArray(data.settings)&&data.settings[0]&&typeof data.settings[0]==='object'){
      const incoming={...data.settings[0]};
      delete incoming.id;delete incoming.theme;delete incoming.habitCompletionAnimation;
      await L.updateSettings(incoming);
    }
    toast('Datos importados correctamente.');
    setTimeout(()=>location.reload(),600);
  }catch(err){
    alert('No se pudo importar el archivo. Verifica que sea un JSON de datos exportado desde Centro.');
  }
}
async function boot(){const saved=localStorage.getItem('centro-theme')||'dark';setTheme(saved);applyUiScale(getUiScale());applySideMargin(getSideMargin());await L.init();try{const logoRec=await CentroDB.get('settings','appLogo');state.logo=(logoRec&&logoRec.value)||'';state.logoLabel=(logoRec&&logoRec.label)||'';}catch{state.logo='';state.logoLabel='';}applyFaviconLogo(state.logo);syncPwaManifest(state.logo);setupGlobal();await render();scheduleReminders();}
window.addEventListener('error',e=>console.error('Centro error',e.error||e.message));
boot().catch(e=>{console.error(e);document.querySelector('#root').innerHTML=`<div class="fatal"><h1>No se pudo cargar Centro</h1><p>${esc(e.message||e)}</p><button class="btn btn-primary" onclick="location.reload()">Recargar</button></div>`;});
})();
